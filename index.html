<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Didactic Fighter - 2.5D Engine Pro</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/SkeletonUtils.js"></script>

    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; touch-action: none; color: white; user-select: none; -webkit-user-select: none; }
        
        #game-container { 
            position: absolute; top: 0; left: 0; 
            width: 100vw; height: 100vh; 
            display: flex; justify-content: center; align-items: center; 
            background: #000;
        }
        
        #glCanvas {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%; object-fit: contain;
            z-index: 1; display: block;
        }

        #gameCanvas { 
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%; object-fit: contain;
            z-index: 5; display: block;
            pointer-events: none; 
            background: transparent; 
        }

        #intro-video-element {
            position: absolute; inset: 0; width: 100%; height: 100%;
            object-fit: cover; z-index: 300; display: none;
            background: black; transition: opacity 1.5s ease-out;
        }

        #loading-screen { position: absolute; inset: 0; background: #050510; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 500; }
        .spinner { width: 50px; height: 50px; border: 5px solid #1a1a4a; border-top: 5px solid cyan; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .hud { position: absolute; top: 20px; width: 90%; display: none; justify-content: space-between; align-items: flex-start; pointer-events: none; z-index: 10; opacity: 0; transition: opacity 1s; }
        .health-bar-container { width: 300px; height: 25px; background: #333; border: 2px solid #fff; position: relative; border-radius: 5px; overflow: hidden; }
        .health-fill { height: 100%; width: 100%; transition: width 0.3s; }
        #p1-health-fill { background: linear-gradient(90deg, #ff3e3e, #ff9a9a); }
        #p2-health-fill { background: linear-gradient(90deg, #3e8bff, #9abeff); }
        .charge-bar { height: 6px; background: yellow; width: 0%; margin-top: 5px; border-radius: 3px; }

        #ai-menu { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); pointer-events: auto; display: flex; flex-direction: column; align-items: center; gap: 10px; background: rgba(0,0,0,0.8); padding: 15px; border-radius: 10px; border: 1px solid cyan; }
        #theme-input { background: #222; border: 1px solid cyan; color: white; padding: 8px; border-radius: 4px; width: 250px; text-align: center; }
        .gemini-btn { background: linear-gradient(45deg, #4285f4, #9b51e0); border: none; color: white; padding: 8px 20px; cursor: pointer; border-radius: 20px; font-weight: bold; text-transform: uppercase; }

        #selection-screen {
            position: absolute; inset: 0; background: #111; z-index: 400;
            display: none; flex-direction: column; align-items: center; justify-content: flex-start;
            padding: 40px 20px; overflow-y: auto;
        }
        .selection-grid { display: flex; gap: 20px; margin-bottom: 20px; flex-wrap: wrap; justify-content: center; }
        .select-card { border: 2px solid #444; border-radius: 10px; cursor: pointer; transition: all 0.2s; display: flex; flex-direction: column; align-items: center; background: #222; padding: 10px; width: 120px; text-align: center;}
        .select-card:hover { border-color: white; transform: scale(1.05); }
        .select-card.selected { border-color: cyan; box-shadow: 0 0 15px cyan; background: #003333; }
        .select-card img { border-radius: 5px; display: block; margin-bottom: 5px; width: 100%; height: auto; }
        .char-img { width: 100px; height: 100px; object-fit: cover; }
        .stage-img { width: 200px; height: 100px; object-fit: cover; }
        .section-title { color: cyan; margin: 15px 0 5px 0; text-transform: uppercase; font-size: 18px; font-weight: bold; }

        #quiz-overlay { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(10, 10, 30, 0.85); border: 4px solid cyan; padding: 40px; display: none; flex-direction: column; align-items: center; width: 70%; max-width: 800px; text-align: center; border-radius: 20px; z-index: 100; backdrop-filter: blur(5px); }
        .options-container { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; width: 100%; margin-top: 30px; }
        .opt-btn { background: #1a1a4a; border: 2px solid cyan; color: white; padding: 20px; cursor: pointer; border-radius: 10px; font-size: 18px; }
        
        #message-box { position: absolute; bottom: 120px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.9); color: #00ffff; padding: 15px 30px; border: 2px solid #00ffff; border-radius: 10px; display: none; z-index: 150; text-align: center; font-size: 20px; font-weight: bold; box-shadow: 0 0 20px rgba(0, 255, 255, 0.4); animation: popIn 0.3s ease-out; }
        @keyframes popIn { 0% { transform: translate(-50%, 20px) scale(0.8); opacity: 0; } 100% { transform: translate(-50%, 0) scale(1); opacity: 1; } }
        
        #victory-ui { position: absolute; bottom: 50px; left: 50%; transform: translateX(-50%); display: none; z-index: 200; flex-direction: column; align-items: center; gap: 20px; }
        #victory-text { font-size: 40px; color: yellow; text-shadow: 0 0 10px red; font-weight: bold; text-transform: uppercase; margin-bottom: 20px; }
        #tutor-explanation { margin-top: 20px; padding: 15px; background: rgba(0, 255, 255, 0.1); border-left: 4px solid cyan; text-align: left; font-size: 16px; display: none; }
        
        #mobile-controls { 
            position: absolute; bottom: 20px; width: 100%; height: 180px; 
            display: none; pointer-events: auto; z-index: 50; 
            justify-content: space-between; padding: 0 30px; box-sizing: border-box; 
            opacity: 0; transition: opacity 1s; 
        }

        @media (pointer: coarse) { 
            #mobile-controls.visible { display: flex; opacity: 1; } 
        }
        
        .joystick-area { width: 150px; height: 150px; position: relative; pointer-events: auto; }
        .joystick-base { width: 120px; height: 120px; background: rgba(255, 255, 255, 0.1); border: 2px solid rgba(255, 255, 255, 0.3); border-radius: 50%; position: absolute; bottom: 10px; left: 10px; display: flex; justify-content: center; align-items: center; }
        .joystick-stick { width: 50px; height: 50px; background: rgba(0, 255, 255, 0.5); border-radius: 50%; box-shadow: 0 0 10px cyan; position: absolute; transform: translate(0, 0); }

        .actions-area { width: 180px; height: 180px; position: relative; pointer-events: auto; }
        .touch-btn { width: 60px; height: 60px; background: rgba(255, 255, 255, 0.15); border: 2px solid rgba(255, 255, 255, 0.3); border-radius: 50%; color: white; font-size: 14px; font-weight: bold; display: flex; justify-content: center; align-items: center; user-select: none; touch-action: manipulation; backdrop-filter: blur(4px); cursor: pointer; position: absolute; }
        .touch-btn:active, .touch-btn.active { background: rgba(0, 255, 255, 0.4); border-color: cyan; transform: scale(0.95); }
        .btn-jump { top: 0; left: 60px; background: rgba(0, 255, 0, 0.2); } 
        .btn-down { bottom: 0; left: 60px; background: rgba(255, 255, 255, 0.2); } 
        .btn-atk { top: 60px; left: 0; background: rgba(255, 0, 0, 0.2); width: 65px; height: 65px; } 
        .btn-shoot { top: 60px; right: 0; background: rgba(255, 255, 0, 0.2); width: 65px; height: 65px;} 

        #debug-toggle { position: absolute; bottom: 20px; left: 20px; font-size: 14px; color: #888; pointer-events: auto; z-index: 60; display: flex; align-items: center; gap: 5px; cursor: pointer; }
        
        #fullscreen-btn { position: absolute; top: 10px; right: 10px; z-index: 200; background: rgba(0,0,0,0.5); border: 1px solid #555; color: white; padding: 5px 10px; border-radius: 5px; font-size: 12px; pointer-events: auto; display: none; cursor: pointer;}
        @media (pointer: coarse) { #fullscreen-btn { display: block; } }
    </style>
</head>
<body>

    <div id="loading-screen">
        <div class="spinner"></div>
        <p id="loading-text" style="margin-top: 20px; color: cyan;">A conectar ao Servidor...</p>
    </div>

    <div id="selection-screen">
        <h1 style="color:white; margin-bottom: 20px; text-shadow: 0 0 10px cyan;">SELEÇÃO DE BATALHA</h1>
        
        <div class="section-title">Modo de Jogo</div>
        <div class="selection-grid" id="mode-select-container">
            <div class="select-card selected" id="mode-1p" onclick="setGameMode('1p')">1 JOGADOR<br><small style="color:#aaa">(vs CPU)</small></div>
            <div class="select-card" id="mode-2p" onclick="setGameMode('2p')">2 JOGADORES<br><small style="color:#aaa">(Local)</small></div>
        </div>

        <div class="section-title">Jogador 1</div>
        <div class="selection-grid" id="p1-select-container"></div>
        <div class="section-title">Jogador 2</div>
        <div class="selection-grid" id="p2-select-container"></div>
        <div class="section-title">Cenário</div>
        <div class="selection-grid" id="stage-select-container"></div>
        
        <button class="gemini-btn" id="confirm-selection-btn" style="font-size: 20px; padding: 15px 40px; margin-top: 30px; margin-bottom: 50px;">INICIAR COMBATE</button>
    </div>

    <div id="game-container">
        <button id="fullscreen-btn">Tela Cheia</button>
        <video id="intro-video-element" playsinline crossOrigin="anonymous"></video>
        
        <canvas id="glCanvas"></canvas> 
        <canvas id="gameCanvas"></canvas> 

        <div class="hud" id="hud-layer">
            <div>
                <div class="health-bar-container"><div id="p1-health-fill" class="health-fill"></div></div>
                <div id="p1-charge" class="charge-bar"></div>
            </div>
            <div id="ai-menu">
                <input type="text" id="theme-input" value="Matemática Básica do Ensino Fundamental" placeholder="Tema do Quiz">
                <button class="gemini-btn" onclick="generateQuestions()">Gerar Desafios ✨</button>
                <div id="loader" style="display:none; color: cyan;">IA a processar...</div>
            </div>
            <div>
                <div class="health-bar-container"><div id="p2-health-fill" class="health-fill"></div></div>
                <div id="p2-charge" class="charge-bar"></div>
            </div>
        </div>

        <div id="message-box"></div>

        <div id="victory-ui">
            <div id="victory-text">VITÓRIA!</div>
            <button class="gemini-btn" onclick="location.reload()">VOLTAR À SELEÇÃO</button>
        </div>

        <div id="mobile-controls">
            <div class="joystick-area" id="joystick-zone">
                <div class="joystick-base">
                    <div class="joystick-stick" id="joystick-stick"></div>
                </div>
            </div>
            <div class="actions-area">
                <div class="touch-btn btn-jump" data-key="w">PULAR</div>
                <div class="touch-btn btn-down" data-key="s">DESCER</div>
                <div class="touch-btn btn-atk" data-key="f">SOCO</div>
                <div class="touch-btn btn-shoot" data-key="g">TIRO</div>
            </div>
        </div>

        <div id="quiz-overlay">
            <h2 id="quiz-question" style="font-size: 28px; color: cyan;">Pergunta?</h2>
            <div class="options-container" id="quiz-options"></div>
            <div id="tutor-explanation"></div>
            <button id="quiz-continue-btn" class="opt-btn" style="display:none; margin-top:20px; width:100%;">Continuar</button>
        </div>
        
        <div id="debug-toggle"><input type="checkbox" id="debug-check"> <span style="color:white; background:rgba(0,0,0,0.5); padding:2px;">Debug</span></div>
    </div>

    <script>
        const apiKey = "COLOQUE_AQUI_A_SUA_API_KEY"; // Cole aqui a sua chave de API do Google Gemini

        const REPO_ROOT = "https://raw.githubusercontent.com/gr4ndi09-cell/game_assets/main/assets";
        
        const WORLD_WIDTH = 2752, WORLD_HEIGHT = 1536;
        const CANVAS_WIDTH = 1280, CANVAS_HEIGHT = 720;
        const ASPECT_RATIO = CANVAS_HEIGHT / CANVAS_WIDTH;
        const MIN_VIEW_WIDTH = 1000, MAX_VIEW_WIDTH = 2752;
        const MAX_VIEW_HEIGHT = MAX_VIEW_WIDTH * ASPECT_RATIO;
        const MIN_VIEW_HEIGHT = MIN_VIEW_WIDTH * ASPECT_RATIO;
        const GRAVITY = 2500, JUMP_FORCE = 1800, MOVE_SPEED = 600, GROUND_Y = 1530; 

        const LOGICAL_STATE = { RUN: 'RUN', IDLE: 'IDLE', MELEE: 'MELEE', JUMP: 'JUMP', SHOOT: 'SHOOT' };
        
        // ✨ BANCO DE DADOS (8 PERSONAGENS)
        const CHARACTERS_DB = [
            { id: 'tiger', name: 'Tiger', portrait: `${REPO_ROOT}/chars/tiger/portrait.png`, folder: `${REPO_ROOT}/chars/tiger`, audio: { jump: `${REPO_ROOT}/chars/tiger/audio/jump.mp3`, charge_shot: `${REPO_ROOT}/chars/tiger/audio/charge_shot.mp3` } },
            { id: 'cruzado', name: 'Cruzado', portrait: `${REPO_ROOT}/chars/cruzado/portrait.png`, folder: `${REPO_ROOT}/chars/cruzado`, audio: { jump: `${REPO_ROOT}/chars/cruzado/audio/jump.mp3`, charge_shot: `${REPO_ROOT}/chars/cruzado/audio/charge_shot.mp3` } },
            { id: 'undead', name: 'Undead', portrait: `${REPO_ROOT}/chars/undead/portrait.png`, folder: `${REPO_ROOT}/chars/undead`, audio: { jump: `${REPO_ROOT}/sounds/common/hit.mp3`, charge_shot: `${REPO_ROOT}/sounds/common/shot.mp3` } },
            { id: 'goblin', name: 'Goblin', portrait: `${REPO_ROOT}/chars/goblin/portrait.png`, folder: `${REPO_ROOT}/chars/goblin`, audio: { jump: `${REPO_ROOT}/sounds/common/hit.mp3`, charge_shot: `${REPO_ROOT}/sounds/common/shot.mp3` } },
            { id: 'golem', name: 'Golem', portrait: `${REPO_ROOT}/chars/golem/portrait.png`, folder: `${REPO_ROOT}/chars/golem`, audio: { jump: `${REPO_ROOT}/sounds/common/hit.mp3`, charge_shot: `${REPO_ROOT}/sounds/common/shot.mp3` } },
            { id: 'elven', name: 'Elven', portrait: `${REPO_ROOT}/chars/elven/portrait.png`, folder: `${REPO_ROOT}/chars/elven`, audio: { jump: `${REPO_ROOT}/sounds/common/hit.mp3`, charge_shot: `${REPO_ROOT}/sounds/common/shot.mp3` } },
            { id: 'spartan', name: 'Spartan', portrait: `${REPO_ROOT}/chars/spartan/portrait.png`, folder: `${REPO_ROOT}/chars/spartan`, audio: { jump: `${REPO_ROOT}/sounds/common/hit.mp3`, charge_shot: `${REPO_ROOT}/sounds/common/shot.mp3` } },
            { id: 'forester', name: 'Forester', portrait: `${REPO_ROOT}/chars/forester/portrait.png`, folder: `${REPO_ROOT}/chars/forester`, audio: { jump: `${REPO_ROOT}/sounds/common/hit.mp3`, charge_shot: `${REPO_ROOT}/sounds/common/shot.mp3` } }
        ];

        const STAGES_DB = [
            { id: 'floresta', name: 'Floresta Sombria', portrait: `${REPO_ROOT}/cenarios/floresta/portrait.png`, folder: `${REPO_ROOT}/cenarios/floresta`, audio: { intro: `${REPO_ROOT}/cenarios/floresta/audio/intro.mp3`, ambience: `${REPO_ROOT}/cenarios/floresta/audio/ambience.mp3` } },
            { id: 'cristalcave', name: 'Caverna de Cristal', portrait: `${REPO_ROOT}/cenarios/cristalcave/portrait.png`, folder: `${REPO_ROOT}/cenarios/cristalcave`, audio: { intro: `${REPO_ROOT}/cenarios/cristalcave/audio/intro.mp3`, ambience: `${REPO_ROOT}/cenarios/cristalcave/audio/ambience.mp3` } }
        ];

        const COMMON_SOUNDS = { shot: `${REPO_ROOT}/sounds/common/shot.mp3`, hit: `${REPO_ROOT}/sounds/common/hit.mp3` };

        let assets = { loaded: false };
        let colliders = []; 
        let keys = {};
        let camera = { x: 0, y: 0, viewWidth: MAX_VIEW_WIDTH, viewHeight: MAX_VIEW_HEIGHT, targetViewWidth: MAX_VIEW_WIDTH };
        let gameState = 'SELECTION'; 
        let gameMode = '1p';
        let questions = [{ q: "Pronto?", options: ["Sim"], correct: 0 }];
        let bullets = [], explosions = [];
        let p1 = null, p2 = null; 
        let currentWinner = null, currentLoser = null;
        let lastTime = 0, cinematicTimer = 0;
        let globalParticles = [], stageFX = null;
        let introFinished = false, gameLoopRunning = false;
        let mysticFruit={active:false,x:0,y:0,radius:25,lastSpawnTime:0,pulse:0,healAmount:40,glints:[],smoke:[]};
        let fruitSpawnPoints = []; 
        let minions = [], availableMinionIds = [], minionSpawnTimer = 0;
        
        let globalAnimations = {}; 
        let skyMesh = null; 
        let stageEnv = { sky: true, parallax: 400, boss: null };
        let currentBoss = null;

        let selectedP1 = CHARACTERS_DB[0];
        let selectedP2 = CHARACTERS_DB[1];
        let selectedStage = STAGES_DB[0];

        let scene3D, renderer3D, camera3D;
        const canvas2D = document.getElementById('gameCanvas');
        const ctx = canvas2D.getContext('2d');
        const canvas3D = document.getElementById('glCanvas');
        const videoIntro = document.getElementById('intro-video-element');
        const loadingScreen = document.getElementById('loading-screen');
        const selectionScreen = document.getElementById('selection-screen');
        const msgBox = document.getElementById('message-box');
        const victoryUI = document.getElementById('victory-ui');
        const victoryText = document.getElementById('victory-text');
        const debugCheck = document.getElementById('debug-check');
        const fullscreenBtn = document.getElementById('fullscreen-btn');

        function isImageOk(img) { return img && img.complete && img.naturalWidth !== 0; }
        function showMessage(text, duration = 3000) { 
            msgBox.innerText = text; msgBox.style.display = 'block'; 
            msgBox.style.animation = 'none'; msgBox.offsetHeight; msgBox.style.animation = 'popIn 0.3s ease-out';
            setTimeout(() => { msgBox.style.display = 'none'; }, duration); 
        }

        function setGameMode(mode) {
            gameMode = mode;
            document.getElementById('mode-1p').classList.remove('selected');
            document.getElementById('mode-2p').classList.remove('selected');
            document.getElementById(`mode-${mode}`).classList.add('selected');
        }

        function goFullScreen() {
            const doc = window.document; const docEl = doc.documentElement;
            const req = docEl.requestFullscreen || docEl.mozRequestFullScreen || docEl.webkitRequestFullscreen || docEl.msRequestFullscreen;
            if (req) req.call(docEl).catch(err => console.log("Fullscreen negado."));
        }
        fullscreenBtn.onclick = goFullScreen;

        function drawSupernova(ctx, x, y) {
            ctx.save(); ctx.translate(x, y); const time = Date.now() / 1000;
            const grd = ctx.createRadialGradient(0, 0, 10, 0, 0, 800);
            grd.addColorStop(0, "white"); grd.addColorStop(0.1, "cyan"); grd.addColorStop(1, "transparent");
            ctx.fillStyle = grd; ctx.globalCompositeOperation = 'screen';
            ctx.fillRect(-800, -800, 1600, 1600);
            ctx.rotate(time * 0.2); ctx.fillStyle = "rgba(255, 255, 255, 0.1)";
            for (let i = 0; i < 20; i++) { ctx.rotate((Math.PI * 2) / 20); ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(50, 1000); ctx.lineTo(-50, 1000); ctx.fill(); }
            ctx.restore();
        }

        const audioManager = {
            sounds: {}, bgm: null,
            load(key, url) { if(!url) return; const a = new Audio(); a.src = url; a.crossOrigin = "anonymous"; this.sounds[key] = a; },
            play(key, loop = false, volume = 1.0) {
                const snd = this.sounds[key]; if (snd) {
                    if (!loop) { const c = snd.cloneNode(); c.volume = volume; c.play().catch(()=>{}); }
                    else { snd.loop = true; snd.volume = volume; snd.play().catch(()=>{}); this.bgm = snd; }
                }
            },
            stopBGM() { if (this.bgm) { this.bgm.pause(); this.bgm.currentTime = 0; } }
        };

        function initThreeJS() {
            renderer3D = new THREE.WebGLRenderer({ canvas: canvas3D, antialias: true, alpha: false });
            renderer3D.setSize(CANVAS_WIDTH, CANVAS_HEIGHT, false); 
            
            scene3D = new THREE.Scene();
            scene3D.background = new THREE.Color(0x080815);

            camera3D = new THREE.OrthographicCamera(0, MAX_VIEW_WIDTH, MAX_VIEW_HEIGHT, 0, -4000, 4000);
            camera3D.position.z = 100;

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.20); 
            scene3D.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.30);
            dirLight.position.set(0, 0, 500); 
            scene3D.add(dirLight);
        }

        function build3DBackgrounds() {
            if(window.meshBg) scene3D.remove(window.meshBg);
            if(window.meshScene) scene3D.remove(window.meshScene);
            if(window.meshFg) scene3D.remove(window.meshFg);
            if(skyMesh) { scene3D.remove(skyMesh); skyMesh = null; }

            const buildLayer = (assetKey, zPos, emissiveIntensity = 0.0) => {
                if (isImageOk(assets[assetKey])) {
                    const tex = new THREE.Texture(assets[assetKey]);
                    tex.generateMipmaps = false; tex.minFilter = THREE.LinearFilter; 
                    tex.flipY = true; tex.needsUpdate = true;
                    
                    const geo = new THREE.PlaneGeometry(WORLD_WIDTH, WORLD_HEIGHT, 32, 8);
                    const pos = geo.attributes.position;
                    for (let i = 0; i < pos.count; i++) {
                        const x = pos.getX(i);
                        const nx = x / (WORLD_WIDTH / 2);
                        const curveZ = Math.pow(nx, 2) * 300; 
                        pos.setZ(i, curveZ);
                    }
                    geo.computeVertexNormals();

                    const mat = new THREE.MeshStandardMaterial({ 
                        map: tex, transparent: true, alphaTest: 0.1, side: THREE.FrontSide, roughness: 0.8, metalness: 0.1,
                        emissive: new THREE.Color(0xffffff), emissiveMap: tex, emissiveIntensity: emissiveIntensity
                    });
                    
                    const mesh = new THREE.Mesh(geo, mat);
                    mesh.position.set(WORLD_WIDTH / 2, WORLD_HEIGHT / 2, zPos);
                    scene3D.add(mesh);
                    return mesh;
                }
                return null;
            };

            let lightCfg = { bg: 0.8, scene: 0.1, front: 0.2 };
            if (stageFX && stageFX.stageLighting) { lightCfg = stageFX.stageLighting; }

            window.meshBg = buildLayer('stage_bg', -500, lightCfg.bg); 
            window.meshScene = buildLayer('stage_scene', -200, lightCfg.scene);
            window.meshFg = buildLayer('stage_fg', 100, lightCfg.front); 
            
            if (stageEnv.sky && isImageOk(assets['stage_sky'])) {
                const skyTex = new THREE.Texture(assets['stage_sky']);
                skyTex.needsUpdate = true; skyTex.minFilter = THREE.LinearFilter;
                const skyGeo = new THREE.SphereGeometry(1600, 32, 32); 
                const skyMat = new THREE.MeshBasicMaterial({ map: skyTex, side: THREE.BackSide, color: 0xffffff });
                skyMesh = new THREE.Mesh(skyGeo, skyMat);
                skyMesh.position.set(WORLD_WIDTH / 2, WORLD_HEIGHT / 2, -2200); 
                skyMesh.rotation.x = 0.4; skyMesh.rotation.z = 0.15; 
                scene3D.add(skyMesh);
            }
        }

        function getRGBColor(colorStr) {
            if (!colorStr) return 0xffffff;
            if (colorStr.includes('rgba')) {
                const match = colorStr.match(/rgba?\(([^,]+),\s*([^,]+),\s*([^,]+).*/);
                if (match) return `rgb(${match[1]},${match[2]},${match[3]})`;

        const PARTICLE_TEXTURES = {};
        function getParticleTexture(type, shape) {
            const key = type + '_' + (shape || 'circle');
            if (PARTICLE_TEXTURES[key]) return PARTICLE_TEXTURES[key];

            const canvas = document.createElement('canvas');
            canvas.width = 64; canvas.height = 64;
            const ctx = canvas.getContext('2d');
            
            if (type === 'glow' || type === 'fire' || type === 'spark') {
                const grd = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
                grd.addColorStop(0, 'rgba(255,255,255,1)'); grd.addColorStop(0.3, 'rgba(255,255,255,0.6)'); grd.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.fillStyle = grd; ctx.fillRect(0,0,64,64);
            } else if (type === 'smoke') {
                ctx.fillStyle = 'rgba(255,255,255,0.1)';
                ctx.beginPath(); ctx.arc(32, 32, 24, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(20, 24, 16, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(44, 24, 16, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(24, 44, 16, 0, Math.PI*2); ctx.fill();
                ctx.beginPath(); ctx.arc(40, 44, 16, 0, Math.PI*2); ctx.fill();
                const grd = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
                grd.addColorStop(0, 'rgba(255,255,255,0.6)'); grd.addColorStop(1, 'rgba(255,255,255,0)');
                ctx.fillStyle = grd; ctx.fillRect(0,0,64,64);
            } else if (type === 'rain') {
                ctx.fillStyle = '#ffffff'; ctx.fillRect(30, 0, 4, 64);
            } else {
                ctx.translate(32, 32); ctx.fillStyle = '#ffffff'; ctx.shadowBlur = 10; ctx.shadowColor = '#ffffff';
                if (shape === 'square') { ctx.fillRect(-16, -16, 32, 32); }
                else if (shape === 'leaf') { ctx.beginPath(); ctx.ellipse(0, 0, 20, 10, Math.PI/4, 0, 2*Math.PI); ctx.fill(); }
                else if (shape === 'star') { 
                    ctx.beginPath(); 
                    for(let i=0;i<5;i++) { 
                        ctx.lineTo(Math.cos((18+i*72)*Math.PI/180)*20, -Math.sin((18+i*72)*Math.PI/180)*20);
                        ctx.lineTo(Math.cos((54+i*72)*Math.PI/180)*10, -Math.sin((54+i*72)*Math.PI/180)*10);
                    } 
                    ctx.closePath(); ctx.fill();

                else { ctx.beginPath(); ctx.arc(0, 0, 20, 0, Math.PI*2); ctx.fill(); }
            }
            
            const tex = new THREE.CanvasTexture(canvas);
            PARTICLE_TEXTURES[key] = tex;

        }

        class Particle {
            constructor(config) {

                this.spawnDelay = config.spawnRate ? Math.random() * 2 : 0; this.spawnRate = config.spawnRate || 0;
                this.fadeRate = config.fadeRate || 0; this.baseSize = config.baseSize || 2.0; 
                this.shape = config.shape || "circle"; this.layer = config.layer || 'main'; this.alpha = 0;
                
                const isWarm = this.baseColor.includes('255') || this.baseColor.includes('#ff') || this.baseColor.includes('orange');
                this.isFire = (this.type === 'upward') ? isWarm : (this.type === 'fire');

                let texType = 'glow';
                if (this.type === 'smoke' || (this.type === 'upward' && !this.isFire)) texType = 'smoke';
                else if (this.type === 'rain') texType = 'rain';
                else if (this.type === 'ambient' || this.type === 'insect') texType = 'shape';

                let blendMode = THREE.NormalBlending;
                if (this.isFire || this.type === 'spark' || config.glow || this.type === 'fire') blendMode = THREE.AdditiveBlending;

                this.spriteMat = new THREE.SpriteMaterial({ map: getParticleTexture(texType, this.shape), color: new THREE.Color(getRGBColor(this.baseColor)), transparent: true, opacity: 0, blending: blendMode, depthWrite: false });
                this.sprite = new THREE.Sprite(this.spriteMat); scene3D.add(this.sprite);

                this.glow = config.glow || false;
                if (!this.glow && (this.type === 'spark' || this.isFire)) if (Math.random() < 0.15) this.glow = true;
                if (this.glow) { this.light = new THREE.PointLight(getRGBColor(this.baseColor), 1.0, 350); scene3D.add(this.light); }
                this.reset();
            }
            reset() {
                if (this.zone) { this.x = this.zone.x + Math.random() * this.zone.w; this.y = this.zone.y + Math.random() * this.zone.h; } 
                else { this.x = Math.random() * WORLD_WIDTH; this.y = Math.random() * WORLD_HEIGHT; }
                this.size = (Math.random() * 2 + 1) * (this.baseSize / 2);
                this.speedX = (Math.random() - 0.5) * 40; this.speedY = (Math.random() - 0.5) * 40;
                this.alpha = (this.type === 'rain') ? 0.6 : (Math.random() * 0.5 + 0.5);
                if (this.fadeRate > 0) this.alpha = 1.0; 
                if (this.type === 'rain') { this.y = -10; this.speedY = 300 + Math.random() * 200; this.speedX = 50; this.size = Math.random() * 20 + 10; } 
                else if (this.type === 'upward' || this.type === 'fire' || this.type === 'smoke') { if (!this.zone) this.y = WORLD_HEIGHT + 10; this.speedY = -20 - Math.random() * 50; } 
                else if (this.type === 'spark') { this.speedX = (Math.random() - 0.5) * 300; this.speedY = -(Math.random() * 200 + 100); this.gravity = 800; this.bounce = 0.6; this.shape = "square"; } 
                else if (this.type === 'insect') { this.speedX = (Math.random() - 0.5) * 60; this.speedY = (Math.random() - 0.5) * 60; }
            }
            update(dt) {
                if (this.spawnDelay > 0) { this.spawnDelay -= dt; return; }
                if (this.fadeRate > 0) { this.alpha -= this.fadeRate * dt; if (this.alpha <= 0) { this.reset(); if (this.spawnRate > 0) { this.spawnDelay = Math.random() * (10 / this.spawnRate); } return; } } 
                else if (this.type === 'ambient') { this.alpha += (Math.random() - 0.5) * 2 * dt; if (this.alpha < 0) this.alpha = 0; else if (this.alpha > 1) this.alpha = 1; }

                if (this.type === 'insect') {
                    let flee = false;
                    [p1, p2].forEach(p => { if (!p) return; let dx = (p.x + p.w/2) - this.x; let dy = (p.y + p.h/2) - this.y; if (Math.sqrt(dx*dx + dy*dy) < 150) { flee = true; this.speedX -= (dx / Math.sqrt(dx*dx + dy*dy)) * 800 * dt; this.speedY -= (dy / Math.sqrt(dx*dx + dy*dy)) * 800 * dt; } });
                    if (!flee && this.zone) {
                        this.speedX += (Math.random() - 0.5) * 300 * dt; this.speedY += (Math.random() - 0.5) * 300 * dt;
                        const returnForce = 1000 * dt;
                        if (this.x < this.zone.x) this.speedX += returnForce; else if (this.x > this.zone.x + this.zone.w) this.speedX -= returnForce;
                        if (this.y < this.zone.y) this.speedY += returnForce; else if (this.y > this.zone.y + this.zone.h) this.speedY -= returnForce;
                        this.speedX *= 0.92; this.speedY *= 0.92;
                    } else { this.speedX *= 0.96; this.speedY *= 0.96; }
                    this.x += this.speedX * dt; this.y += this.speedY * dt; this.alpha = 0.3 + Math.random() * 0.7; 
                } else {
                    this.speedY += this.gravity * dt; this.x += this.speedX * dt; this.y += this.speedY * dt;
                    if (this.y >= GROUND_Y && this.type === 'spark') { this.speedX *= this.friction; }
                    if (this.y >= GROUND_Y) {
                        if (this.bounce > 0) { this.y = GROUND_Y; this.speedY *= -this.bounce; if (Math.abs(this.speedY) < 50) this.speedY = 0; } 
                        else if (this.type !== 'spark') { if (!this.zone && this.y > WORLD_HEIGHT + 50) this.reset(); }
                    }
                    if (this.type === 'spark') { [p1, p2].forEach(p => { if (!p) return; if (this.x > p.x && this.x < p.x + p.w && this.y > p.y && this.y < p.y + p.h) { this.speedX *= -0.8; this.speedY *= 0.8; } }); }
                }
                
                const isOutOfBounds = (this.x < -100 || this.x > WORLD_WIDTH + 100 || this.y < -100 || this.y > WORLD_HEIGHT + 100);
                const isStopped = (this.type === 'spark' && Math.abs(this.speedX) < 1 && Math.abs(this.speedY) < 1);
                if ((isOutOfBounds || isStopped) && this.fadeRate <= 0) { this.reset(); if (this.spawnRate > 0) { this.spawnDelay = Math.random() * (10 / this.spawnRate); } }

                if (this.sprite) {
                    let zDepthSprite = 0; 
                    if (this.layer === 'bg') zDepthSprite = -480;
                    else if (this.layer === 'boss') zDepthSprite = -300;
                    else if (this.layer === 'scene') zDepthSprite = -180;
                    else if (this.layer === 'front') zDepthSprite = 120;
                    
                    const nx = (this.x - WORLD_WIDTH / 2) / (WORLD_WIDTH / 2);
                    const curveZ = Math.pow(nx, 2) * 300;
                    
                    this.sprite.position.set(this.x, WORLD_HEIGHT - this.y, zDepthSprite + curveZ);
                    let finalScale = this.size * 5; let finalOpacity = this.alpha;
                    if (this.isFire || this.type === 'fire') { finalScale = this.size * 10 * this.alpha; finalOpacity = this.alpha; }

                }

                    if (this.layer === 'bg') zDepthLight = -450; 
                    else if (this.layer === 'boss') zDepthLight = -280; 
                    else if (this.layer === 'scene') zDepthLight = -150; 
                    else if (this.layer === 'front') zDepthLight = 125; 
                    
                    const nx = (this.x - WORLD_WIDTH / 2) / (WORLD_WIDTH / 2);
                    const curveZ = Math.pow(nx, 2) * 300;

            }

            destroy() { if (this.sprite) scene3D.remove(this.sprite); if (this.light) scene3D.remove(this.light); }
        }

        class StageFX {
            constructor() { this.particlesByLayer = { bg: [], boss: [], scene: [], main: [], front: [] }; this.lights = []; this.zones = []; this.stageLighting = null; }
            init(stageConfig) {
                if (this.lights) this.lights.forEach(l => { if(l.light3D) scene3D.remove(l.light3D); });
                for (const layer in this.particlesByLayer) { this.particlesByLayer[layer].forEach(p => p.destroy && p.destroy()); }

                this.particlesByLayer = { bg: [], boss: [], scene: [], main: [], front: [] }; this.lights = []; this.zones = [];
                
                if (!stageConfig) { 
                    this.addDefaultEmitters(); 
                    stageEnv = { sky: true, parallax: 400, boss: null };
                } 
                else {
                    this.stageLighting = stageConfig.lighting || { bg: 0.8, scene: 0.1, front: 0.2 };
                    if (stageConfig.environment) {
                        stageEnv.sky = stageConfig.environment.sky !== false; 
                        stageEnv.parallax = stageConfig.environment.parallax !== undefined ? stageConfig.environment.parallax : 400;
                        stageEnv.boss = stageConfig.environment.boss || null;
                    } else { stageEnv = { sky: true, parallax: 400, boss: null }; }

                    const emitters = stageConfig.emitters || []; this.lights = stageConfig.lights || []; this.zones = stageConfig.zones || [];
                    emitters.forEach(emit => { const layer = emit.layer || 'main'; if (!this.particlesByLayer[layer]) this.particlesByLayer[layer] = []; for(let i=0; i<emit.count; i++) { this.particlesByLayer[layer].push(new Particle(emit)); } });
                }

                this.lights.forEach(l => {
                    const threeColor = new THREE.Color(getRGBColor(l.color));
                    let alphaMatch = l.color ? l.color.match(/rgba\([^,]+,[^,]+,[^,]+,\s*([0-9.]+)\)/) : null;
                    let intensity = alphaMatch ? parseFloat(alphaMatch[1]) * 15 : 4.0; 
                    
                    l.light3D = new THREE.PointLight(threeColor, intensity, l.radius * 2.5);
                    const nx = (l.x - WORLD_WIDTH / 2) / (WORLD_WIDTH / 2); const curveZ = Math.pow(nx, 2) * 300;

                    let zDepth = 25; 
                    if(l.layer === 'bg') zDepth = -450; else if (l.layer === 'boss') zDepth = -280; else if(l.layer === 'scene') zDepth = -150; else if(l.layer === 'front') zDepth = 125; 
                    
                    l.light3D.position.set(l.x, WORLD_HEIGHT - l.y, zDepth + curveZ);
                    scene3D.add(l.light3D); l.baseIntensity = intensity;
                });
            }
            addDefaultEmitters() {
                this.stageLighting = { bg: 0.8, scene: 0.1, front: 0.2 };
                const layer = 'main'; if (!this.particlesByLayer[layer]) this.particlesByLayer[layer] = [];
                for(let i=0; i<30; i++) { this.particlesByLayer[layer].push(new Particle({ type: 'ambient', color: '#ffaa00' })); }
                this.lights = [ { x: 500, y: 1300, radius: 400, color: "rgba(255, 100, 0, 0.4)", effect: "flicker", layer: "scene" } ];
            }
            update(dt) { 
                for (const layer in this.particlesByLayer) { this.particlesByLayer[layer].forEach(p => p.update(dt)); } 
                const time = Date.now();
                this.lights.forEach(l => {
                    let f = 1; 
                    if (l.effect === 'pulse') f = Math.sin(time / 300) * 0.2 + 1; 
                    else if (l.effect === 'blink') f = Math.random() < 0.05 ? 0 : 1;
                    else if (l.effect === 'flicker') { f = 1 + (Math.random() - 0.5) * 0.4; l.drawX = l.x + (Math.random() - 0.5) * 5; l.drawY = l.y + (Math.random() - 0.5) * 5; } 
                    else { l.drawX = l.x; l.drawY = l.y; }

                    if(l.light3D) {
                        l.light3D.intensity = l.baseIntensity * f; l.light3D.position.x = l.drawX || l.x; l.light3D.position.y = WORLD_HEIGHT - (l.drawY || l.y);
                        const nx = (l.light3D.position.x - WORLD_WIDTH / 2) / (WORLD_WIDTH / 2); const curveZ = Math.pow(nx, 2) * 300;
                        let zDepth = 25; 
                        if(l.layer === 'bg') zDepth = -450; else if(l.layer === 'boss') zDepth = -280; else if(l.layer === 'scene') zDepth = -150; else if(l.layer === 'front') zDepth = 125; 
                        l.light3D.position.z = zDepth + curveZ;
                    }
                });
            }
            draw(ctx, layerName) {
                if (this.particlesByLayer[layerName]) { this.particlesByLayer[layerName].forEach(p => p.draw(ctx)); }
                const time = Date.now() / 1000;
                this.zones.forEach(z => {
                     const targetLayer = z.layer || 'front'; if (targetLayer !== layerName) return;
                     if (z.background) { ctx.fillStyle = z.background; ctx.fillRect(z.x, z.y, z.w, z.h); }
                     if (z.style === 'radial') {
                         const g = ctx.createRadialGradient(z.x + z.w/2, z.y + z.h/2, 0, z.x + z.w/2, z.y + z.h/2, z.w/1.5); g.addColorStop(0, `rgba(0,0,0,0)`); g.addColorStop(1, z.color || `rgba(0,0,0,0.8)`);
                         ctx.fillStyle = g; ctx.fillRect(z.x, z.y, z.w, z.h);
                     } else {
                         ctx.save(); ctx.beginPath(); ctx.rect(z.x, z.y, z.w, z.h); ctx.clip(); 
                         if (z.distortion) {
                             ctx.globalCompositeOperation = 'overlay'; ctx.globalAlpha = 0.3; ctx.fillStyle = z.color || '#aaf';
                             const amp = z.distortion.amplitude || 5; const freq = z.distortion.frequency || 0.1; const spd = z.distortion.speed || 5;
                             const waveHeight = 15; const numWaves = Math.ceil(z.h / waveHeight) + 1;
                             for(let i=0; i<numWaves; i++) {
                                 const yOffset = (time * spd * 10 + i * waveHeight) % (z.h + waveHeight); let actualY = z.y + z.h - yOffset;
                                 const xOffset = Math.sin(time * 3 + i * freq) * amp;
                                 try { ctx.drawImage(canvas2D, z.x, actualY, z.w, waveHeight, z.x + xOffset, actualY, z.w, waveHeight); } catch(e) {}
                                 ctx.fillRect(z.x + xOffset - 5, actualY, z.w + 10, waveHeight * 0.8);
                             }
                         } else { ctx.fillStyle = z.color; ctx.fillRect(z.x, z.y, z.w, z.h); }
                         ctx.restore();
                     }
                });
            }
        }

        class StageBoss2DFallback {
            constructor(config) {
                this.config = config || {};
                this.x = WORLD_WIDTH / 2;
                
                // Força a leitura do 'y' como número. Se não existir no JSON, usa 800.
                this.y = (this.config.position && this.config.position.y !== undefined) ? Number(this.config.position.y) : 800;
                
                this.meshGroup = new THREE.Group();
                scene3D.add(this.meshGroup);
                this.isBuilt = false;

                this.layers = [
                    { key: 'boss1', speed: 0.02, zOffset: -30, mesh: null },
                    { key: 'boss2', speed: 0.05, zOffset: -20, mesh: null },
                    { key: 'boss3', speed: 0.09, zOffset: -10, mesh: null },
                    { key: 'boss4', speed: 0.14, zOffset: 0, mesh: null }
                ];

                let zDepth = -300; 
                if (this.config.position) {
                    if (this.config.position.zDepth === 'bg') zDepth = -450;
                    else if (this.config.position.zDepth === 'boss') zDepth = -300;
                    else if (this.config.position.zDepth === 'scene') zDepth = -150;
                }
                this.baseZ = zDepth;
            }

            update(dt) {
                if (!this.isBuilt) {
                    let allLoaded = true;
                    this.layers.forEach(l => { if (!isImageOk(assets[l.key])) allLoaded = false; });
                    
                    if (allLoaded) {
                        // Calcula o multiplicador de escala com base na camada principal (boss1)
                        let baseImg = assets['boss1'];
                        let baseWidth = (baseImg && baseImg.naturalWidth) ? baseImg.naturalWidth : 800;
                        let scaleFactor = this.config.scale2D ? (Number(this.config.scale2D) / baseWidth) : 1.0;

                        this.layers.forEach(l => {
                            const tex = new THREE.Texture(assets[l.key]);
                            tex.needsUpdate = true; 
                            tex.flipY = true; 
                            tex.colorSpace = THREE.SRGBColorSpace;
                            
                            const mat = new THREE.MeshBasicMaterial({ 
                                map: tex, transparent: true, alphaTest: 0.05, side: THREE.DoubleSide, depthWrite: false
                            });
                            
                            // Aplica a proporção calculada de forma justa a todas as peças!
                            let width = assets[l.key].naturalWidth * scaleFactor;
                            let height = assets[l.key].naturalHeight * scaleFactor;

                            const geo = new THREE.PlaneGeometry(width, height);
                            l.mesh = new THREE.Mesh(geo, mat);
                            l.mesh.position.z = l.zOffset;
                            
                            this.meshGroup.add(l.mesh);
                        });
                        this.isBuilt = true;
                    }
                    return; 
                }

                if (!p1 || !p2) return;
                const d1 = Math.hypot(p1.x-this.x, p1.y-this.y); 
                const d2 = Math.hypot(p2.x-this.x, p2.y-this.y); 
                const target = (d1 < d2) ? p1 : p2; 
                
                const dx = target.x - this.x; 
                const dy = target.y - this.y; 

                this.layers.forEach(l => {
                    if (l.mesh) {
                        const targetX = dx * l.speed;
                        const targetY = -dy * l.speed;
                        l.mesh.position.x += (targetX - l.mesh.position.x) * 2 * dt;
                        l.mesh.position.y += (targetY - l.mesh.position.y) * 2 * dt;
                    }
                });

                const nx = (this.x - WORLD_WIDTH / 2) / (WORLD_WIDTH / 2);
                const curveZ = Math.pow(nx, 2) * 300;

                let bob = 0;
                if (this.config && this.config.behavior && this.config.behavior.bobbing) {
                    bob = Math.sin(Date.now() / 500) * 30;
                }

                this.meshGroup.position.set(this.x, WORLD_HEIGHT - (this.y + bob), this.baseZ + curveZ);
            }
        }

        class StageBoss {
            constructor(config, folderUrl) {
                this.config = config;
                this.x = WORLD_WIDTH / 2;
                this.y = (config.position && config.position.y !== undefined) ? Number(config.position.y) : 800;
                
                this.meshGroup = new THREE.Group();
                scene3D.add(this.meshGroup);

                const bossModelFile = config.model || 'boss.glb';
                const loader = new THREE.GLTFLoader();
                
                loader.load(`${folderUrl}/${bossModelFile}`, (gltf) => {
                    this.model3D = THREE.SkeletonUtils.clone(gltf.scene);
                    const scale = config.scale || 15.0;
                    this.model3D.scale.set(scale, scale, scale);
                    this.meshGroup.add(this.model3D);
                    
                    this.mixer = new THREE.AnimationMixer(this.model3D);
                    if(gltf.animations && gltf.animations.length > 0) {
                        this.mixer.clipAction(gltf.animations[0]).play();
                    }
                }, undefined, (e) => {
                    console.warn(`[Fallback] Boss 3D não encontrado. A carregar Boss 2D!`);
                    window.currentBoss2D = new StageBoss2DFallback(this.config);
                    scene3D.remove(this.meshGroup);
                    this.meshGroup = null;
                });
            }
            update(dt) {
                if(this.mixer) this.mixer.update(dt);
                
                if (this.meshGroup) {
                    if (this.config.behavior && this.config.behavior.type === 'tracking') {
                        let targetX = WORLD_WIDTH / 2;

        function updateCamera() {
            if(!p1 || !p2) return;
            let p1Center = { x: p1.x + p1.w/2, y: p1.y + p1.h/2 }; let p2Center = { x: p2.x + p2.w/2, y: p2.y + p2.h/2 };
            let minX = Math.min(p1Center.x, p2Center.x); let maxX = Math.max(p1Center.x, p2Center.x);
            let minY = Math.min(p1Center.y, p2Center.y); let maxY = Math.max(p1Center.y, p2Center.y);
            
            const PADDING_X = 600; const PADDING_Y = 400;
            let targetW = (maxX - minX) + PADDING_X; let targetH = (maxY - minY) + PADDING_Y;
            if (targetH * (CANVAS_WIDTH / CANVAS_HEIGHT) > targetW) { targetW = targetH * (CANVAS_WIDTH / CANVAS_HEIGHT); }

            camera.targetViewWidth = Math.max(MIN_VIEW_WIDTH, Math.min(MAX_VIEW_WIDTH, targetW));
            camera.viewWidth += (camera.targetViewWidth - camera.viewWidth) * 0.1;
            camera.viewHeight = camera.viewWidth * ASPECT_RATIO;
            
            let midX = (minX + maxX) / 2; let midY = (minY + maxY) / 2;
            camera.x = midX - camera.viewWidth / 2; camera.y = midY - camera.viewHeight / 2;
            
            if (camera.x < 0) camera.x = 0; if (camera.x + camera.viewWidth > WORLD_WIDTH) camera.x = WORLD_WIDTH - camera.viewWidth;
            if (camera.y + camera.viewHeight > WORLD_HEIGHT) camera.y = WORLD_HEIGHT - camera.viewHeight; if (camera.y < 0) camera.y = 0;

            if (camera3D) {
                camera3D.left = camera.x; camera3D.right = camera.x + camera.viewWidth;
                camera3D.top = WORLD_HEIGHT - camera.y; camera3D.bottom = WORLD_HEIGHT - (camera.y + camera.viewHeight);
                camera3D.updateProjectionMatrix();
            }
        }

        function updateFruit(dt) {
            const now = Date.now();
            if (!mysticFruit.active && (p1.health < 50 || p2.health < 50)) { if (now - mysticFruit.lastSpawnTime > 15000) { const pt = fruitSpawnPoints[Math.floor(Math.random() * fruitSpawnPoints.length)]; mysticFruit.x = pt.x; mysticFruit.y = pt.y; mysticFruit.active = true; mysticFruit.lastSpawnTime = now; mysticFruit.glints = Array.from({ length: 8 }, () => ({ angle: Math.random() * Math.PI * 2, dist: Math.random() * 30, size: Math.random() * 2 + 1 })); showMessage("🍎 Fruta Mística!"); } }
            if (mysticFruit.active) { 
                mysticFruit.pulse = Math.sin(now / 300) * 5; if (Math.random() < 0.3) { mysticFruit.smoke.push({ x: mysticFruit.x + (Math.random() - 0.5) * 20, y: mysticFruit.y + 10, vx: (Math.random() - 0.5) * 20, vy: -50 - Math.random() * 30, life: 1.0, size: Math.random() * 3 + 1 }); }
                mysticFruit.smoke.forEach(p => { p.x += p.vx * dt; p.y += p.vy * dt; p.life -= 1.0 * dt; }); mysticFruit.smoke = mysticFruit.smoke.filter(p => p.life > 0);
                [p1, p2].forEach(p => { if (p && Math.sqrt(Math.pow((p.x+p.w/2)-mysticFruit.x,2) + Math.pow((p.y+p.h/2)-mysticFruit.y,2)) < 80) { p.health = Math.min(100, p.health + 40); mysticFruit.active = false; showMessage(`✨ ${p.id.toUpperCase()} recuperou energia!`); } }); 
            }
        }

        function drawFruit() {
            if (!mysticFruit.active) return; const now = Date.now(); ctx.save();
            mysticFruit.smoke.forEach(p => { ctx.globalAlpha = p.life; ctx.fillStyle = "cyan"; ctx.shadowBlur = 5; ctx.shadowColor = "white"; ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill(); });
            const r = mysticFruit.radius + mysticFruit.pulse; const g = ctx.createRadialGradient(mysticFruit.x, mysticFruit.y, 0, mysticFruit.x, mysticFruit.y, r * 2.5); g.addColorStop(0, 'rgba(255, 50, 50, 0.5)'); g.addColorStop(1, 'rgba(255, 0, 0, 0)'); ctx.fillStyle = g; ctx.globalCompositeOperation = 'screen'; ctx.beginPath(); ctx.arc(mysticFruit.x, mysticFruit.y, r * 2.5, 0, Math.PI * 2); ctx.fill(); ctx.globalCompositeOperation = 'source-over';
            const gr = ctx.createRadialGradient(mysticFruit.x-r/3, mysticFruit.y-r/3, r/5, mysticFruit.x, mysticFruit.y, r); gr.addColorStop(0, '#ffaaaa'); gr.addColorStop(0.5, '#ee0000'); gr.addColorStop(1, '#880000'); ctx.fillStyle = gr; ctx.shadowBlur = 25; ctx.shadowColor = "red"; ctx.beginPath(); ctx.arc(mysticFruit.x, mysticFruit.y, r, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = "white"; mysticFruit.glints.forEach(gl => { const gx = mysticFruit.x + Math.cos(gl.angle + now/500) * (gl.dist + mysticFruit.pulse); const gy = mysticFruit.y + Math.sin(gl.angle + now/500) * (gl.dist + mysticFruit.pulse); ctx.beginPath(); ctx.arc(gx, gy, gl.size * (Math.abs(Math.sin(now/200))), 0, Math.PI*2); ctx.fill(); }); ctx.restore();
        }

        function gameLoop(timestamp) { 
            if (!lastTime) lastTime = timestamp;
            const deltaTime = (timestamp - lastTime) / 1000; lastTime = timestamp;
            const dt = Math.min(deltaTime, 0.1); 
            if (['PLAYING', 'QUIZ', 'DUEL', 'CINEMATIC', 'VICTORY'].includes(gameState)) { update(dt); draw(); }
            requestAnimationFrame(gameLoop); 
        }

        function update(dt) {
            if (gameState === 'CINEMATIC') { cinematicTimer -= dt; if (cinematicTimer <= 0) showQuiz(); return; }
            if (gameState === 'PLAYING') {
                if (stageFX) stageFX.update(dt);
                globalParticles.forEach(p => p.update(dt));
                
                if (skyMesh) skyMesh.rotateY(0.010 * dt); 
                if (gameMode === '1p' && p2) p2.updateAI(dt, p1);
                if (p1) p1.update(dt);
                if (p2) p2.update(dt);
                
                if (availableMinionIds.length > 0) {
                    minionSpawnTimer -= dt;
                    if (minionSpawnTimer <= 0 && minions.length < 5) {
                        let randType = availableMinionIds[Math.floor(Math.random() * availableMinionIds.length)];
                        let spawnX = Math.random() < 0.5 ? camera.x - 50 : camera.x + camera.viewWidth + 50;
                        minions.push(new Minion(spawnX, GROUND_Y - 100, randType));
                        minionSpawnTimer = 5.0 + Math.random() * 5.0; 
                    }
                }
                minions.forEach(m => m.update(dt));
                minions = minions.filter(m => m.health > 0);
                updateFruit(dt);

                if (currentBoss) currentBoss.update(dt);
                if (window.currentBoss2D) window.currentBoss2D.update(dt);
                
                for(let i=bullets.length-1;i>=0;i--){
                    for(let j=i-1;j>=0;j--){
                        const b1=bullets[i],b2=bullets[j];if(!b1||!b2)continue;
                        if(Math.hypot(b1.x-b2.x,b1.y-b2.y) < b1.size + b2.size){
                            if(b1.ic&&b2.ic){explosions.push(new Explosion((b1.x+b2.x)/2,(b1.y+b2.y)/2,"orange")); b1.destroy(); b2.destroy(); bullets.splice(i,1);bullets.splice(j,1);break;}
                            else if(b1.ic&&!b2.ic){b2.destroy(); bullets.splice(j,1);}else if(!b1.ic&&b2.ic){b1.destroy(); bullets.splice(i,1);break;}
                            else{b1.destroy(); b2.destroy(); bullets.splice(i,1);bullets.splice(j,1);break;}
                        }
                    }
                }
                bullets.forEach((b,i)=>{
                    b.update(dt); let hit = false;
                    
                    [p1, p2].forEach(p => {
                        if (p && p.health > 0 && b.x + b.size > p.x && b.x - b.size < p.x + p.w && b.y + b.size > p.y && b.y - b.size < p.y + p.h) {
                            if (b.owner !== p.id) { p.takeDamage(b.damage); hit = true; }
                        }
                    });
                    
                    if (!hit && b.owner !== 'minion') {
                        minions.forEach(m => { 
                            if (m.health > 0 && b.x + b.size > m.x && b.x - b.size < m.x + m.w && b.y + b.size > m.y && b.y - b.size < m.y + m.h) { 
                                m.takeDamage(b.damage); hit = true; 
                            } 
                        });
                    }
                    if(hit) b.active = false;
                    if(!b.active) { b.destroy(); bullets.splice(i,1); }
                });
                
                explosions.forEach((e,i)=>{ e.update(dt); if(e.life<=0 || e.l <= 0) { e.destroy(); explosions.splice(i,1); } });
            }
            updateCamera();
        }

        function draw() {
            if (gameState === 'VICTORY') { drawVictory(); return; }
            if (gameState === 'CINEMATIC' || gameState === 'QUIZ') { drawCinematic(); return; }
            
            if (window.meshBg) {
                window.meshBg.position.x = WORLD_WIDTH / 2; 
                let avgY = GROUND_Y;
                if (p1 && p2) avgY = (p1.y + p2.y) / 2; else if (p1) avgY = p1.y; else if (p2) avgY = p2.y;
                let yRatio = Math.max(0, Math.min(1, avgY / GROUND_Y));
                let parallaxStrength = stageEnv.parallax; 
                window.meshBg.position.y = (WORLD_HEIGHT / 2) + ((yRatio - 0.5) * parallaxStrength);
            }

            ctx.clearRect(0, 0, canvas2D.width, canvas2D.height);
            
            if (renderer3D && scene3D && camera3D) renderer3D.render(scene3D, camera3D);

            if (gameState === 'INTRO') return;
            
            ctx.save(); 
            try {
                const scale = CANVAS_WIDTH / camera.viewWidth; 
                ctx.scale(scale, scale); 
                ctx.translate(-camera.x, -camera.y);
                
                if (stageFX) stageFX.draw(ctx, 'bg');
                if (stageFX) stageFX.draw(ctx, 'boss');
                if (stageFX) stageFX.draw(ctx, 'scene');
                if (stageFX) stageFX.draw(ctx, 'main');
                
                explosions.forEach(ex => ex.draw(ctx));
                minions.forEach(m => m.draw(ctx)); 
                if (p1) p1.draw(ctx); 
                if (p2) p2.draw(ctx); 
                
                bullets.forEach(b => b.draw(ctx));
                drawFruit();
                
                if (stageFX) stageFX.draw(ctx, 'front');
                
                if (debugCheck.checked) { 
                    ctx.fillStyle = "rgba(255, 255, 0, 0.2)"; 
                    colliders.forEach(p => { 
                        if (!p.type || p.type === 'rect') { ctx.fillRect(p.x, p.y, p.w, p.h); } 
                        else if (p.type === 'slope') { ctx.beginPath(); ctx.strokeStyle = "rgba(255, 0, 0, 0.5)"; ctx.lineWidth = 5; ctx.moveTo(p.x1, p.y1); ctx.lineTo(p.x2, p.y2); ctx.stroke(); } 
                    }); 
                }
            } catch(e) { console.error("Erro no desenho:", e); } finally { ctx.restore(); }
        }

        const joystickStick = document.getElementById('joystick-stick');
        let joystickActive = false; let startX = 0;
        const resetJoystick = () => { joystickStick.style.transform = `translate(0px, 0px)`; keys['a'] = false; keys['d'] = false; joystickActive = false; };
        const handleJoystickMove = (e) => {
            if (!joystickActive) return; const touch = e.touches[0]; const rect = joystickZone.getBoundingClientRect(); const centerX = rect.left + rect.width / 2;
            let deltaX = touch.clientX - centerX; const maxDist = 35;
            if (deltaX > maxDist) deltaX = maxDist; if (deltaX < -maxDist) deltaX = -maxDist;
            joystickStick.style.transform = `translate(${deltaX}px, 0px)`;
            if (deltaX < -10) { keys['a'] = true; keys['d'] = false; } else if (deltaX > 10) { keys['d'] = true; keys['a'] = false; } else { keys['a'] = false; keys['d'] = false; }
        };

        joystickZone.addEventListener('touchstart', (e) => { e.preventDefault(); joystickActive = true; handleJoystickMove(e); }, {passive: false});
        joystickZone.addEventListener('touchmove', (e) => { e.preventDefault(); handleJoystickMove(e); }, {passive: false});
        joystickZone.addEventListener('touchend', (e) => { e.preventDefault(); resetJoystick(); }, {passive: false});
        joystickZone.addEventListener('touchcancel', (e) => { e.preventDefault(); resetJoystick(); }, {passive: false});

        const fallbackQuestions = {
            "Matemática": [ { q: "Quanto é 7 x 8?", options: ["54", "56", "62", "48"], correct: 1 }, { q: "Qual é a raiz quadrada de 144?", options: ["10", "12", "14", "16"], correct: 1 }, { q: "Quanto é 15% de 200?", options: ["15", "30", "45", "20"], correct: 1 } ],
            "Geral": [ { q: "Qual é o maior planeta do Sistema Solar?", options: ["Marte", "Terra", "Júpiter", "Saturno"], correct: 2 }, { q: "Quem pintou a Mona Lisa?", options: ["Van Gogh", "Picasso", "Da Vinci", "Michelangelo"], correct: 2 }, { q: "Qual é o elemento químico 'O'?", options: ["Ouro", "Ósmio", "Oxigénio", "Ozónio"], correct: 2 } ]
        };

        async function geminiFetch(prompt, system) {
            let delay = 1000;
            for (let i = 0; i < 3; i++) {
                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${apiKey}`, {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }], systemInstruction: { parts: [{ text: system }] }, generationConfig: { responseMimeType: "application/json" } })
                    });
                    if (!response.ok) throw new Error("Erro HTTP: " + response.status);
                    const data = await response.json(); let textoFinal = data.candidates[0].content.parts[0].text;
                    return JSON.parse(textoFinal.replace(/```json/g, '').replace(/```/g, '').trim());
                } catch (e) { await new Promise(r => setTimeout(r, delay)); delay *= 2; }
            }
            throw new Error("Falha total na comunicação com a API");
        }
        
        async function generateQuestions() {
            const theme = document.getElementById('theme-input').value || 'História'; document.getElementById('loader').style.display = 'block';
            try { 
                const result = await geminiFetch(`Gere 5 perguntas sobre "${theme}". Formato JSON obrigatório: { "questions": [{ "q": "p", "options": ["o1","o2","o3","o4"], "correct": 0 }] }`, "És um professor sábio. Responde estritamente em JSON."); 
                if (result && result.questions) { questions = result.questions; showMessage("✨ Desafios gerados pela IA carregados!"); } else throw new Error();
            } catch (e) { 
                const category = theme.toLowerCase().includes('mat') ? "Matemática" : "Geral"; questions = fallbackQuestions[category] || fallbackQuestions["Geral"];
                showMessage("⚡ Modo Offline: Desafios clássicos carregados!"); 
            } finally { document.getElementById('loader').style.display = 'none'; }
        }
        
        async function explainTopic(question, answer) {
            const tutorEl = document.getElementById('tutor-explanation'); tutorEl.style.display = 'block'; tutorEl.innerText = "A pensar...";
            try { 
                const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${apiKey}`, { 
                    method: 'POST', headers: { 'Content-Type': 'application/json' }, 
                    body: JSON.stringify({ contents: [{ parts: [{ text: `A pergunta era: "${question}". A resposta correta é: "${answer}". Explica rapidamente o porquê desta ser a resposta correta em até 2 frases curtas.` }] }], systemInstruction: { parts: [{ text: "És um professor sábio num jogo de luta." }] } }) 
                }); 
                if (!r.ok) throw new Error();
                const data = await r.json(); tutorEl.innerText = data.candidates[0].content.parts[0].text; 
            } catch (e) { tutorEl.innerText = `O tutor diz: Presta mais atenção! A resposta correta era ${answer}.`; }
        }

        canvas2D.width = CANVAS_WIDTH; canvas2D.height = CANVAS_HEIGHT;
        initSelectionScreen();
    </script>
</body>
</html>
