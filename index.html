<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Didactic Fighter - Gemini Edition</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; touch-action: none; color: white; user-select: none; -webkit-user-select: none; }
        
        #game-container { 
            position: absolute; top: 0; left: 0; 
            width: 100vw; height: 100vh; 
            display: flex; justify-content: center; align-items: center; 
            background: #000;
        }
        
        canvas { 
            background: #000; 
            width: 100%; height: 100%; 
            object-fit: contain; 
            display: block;
            image-rendering: pixelated;
        }

        #intro-video-element {
            position: absolute; inset: 0; width: 100%; height: 100%;
            object-fit: cover; z-index: 300; display: none;
            background: black; transition: opacity 1.5s ease-out;
        }
        
        #bg-video-element { display: none; }

        #loading-screen { position: absolute; inset: 0; background: #050510; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 500; }
        .spinner { width: 50px; height: 50px; border: 5px solid #1a1a4a; border-top: 5px solid cyan; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* HUD */
        .hud { position: absolute; top: 20px; width: 90%; display: none; justify-content: space-between; align-items: flex-start; pointer-events: none; z-index: 10; opacity: 0; transition: opacity 1s; }
        .health-bar-container { width: 300px; height: 25px; background: #333; border: 2px solid #fff; position: relative; border-radius: 5px; overflow: hidden; }
        .health-fill { height: 100%; width: 100%; transition: width 0.3s; }
        #p1-health-fill { background: linear-gradient(90deg, #ff3e3e, #ff9a9a); }
        #p2-health-fill { background: linear-gradient(90deg, #3e8bff, #9abeff); }
        .charge-bar { height: 6px; background: yellow; width: 0%; margin-top: 5px; border-radius: 3px; }

        #ai-menu { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); pointer-events: auto; display: flex; flex-direction: column; align-items: center; gap: 10px; background: rgba(0,0,0,0.8); padding: 15px; border-radius: 10px; border: 1px solid cyan; }
        #theme-input { background: #222; border: 1px solid cyan; color: white; padding: 8px; border-radius: 4px; width: 250px; text-align: center; }
        .gemini-btn { background: linear-gradient(45deg, #4285f4, #9b51e0); border: none; color: white; padding: 8px 20px; cursor: pointer; border-radius: 20px; font-weight: bold; text-transform: uppercase; }

        /* TELA DE SELEÇÃO */
        #selection-screen {
            position: absolute; inset: 0; background: #111; z-index: 400;
            display: none; flex-direction: column; align-items: center; justify-content: flex-start;
            padding: 40px 20px; overflow-y: auto;
        }
        .selection-grid { display: flex; gap: 20px; margin-bottom: 20px; flex-wrap: wrap; justify-content: center; }
        .select-card { border: 2px solid #444; border-radius: 10px; cursor: pointer; transition: all 0.2s; display: flex; flex-direction: column; align-items: center; background: #222; padding: 10px; width: 120px; }
        .select-card:hover { border-color: white; transform: scale(1.05); }
        .select-card.selected { border-color: cyan; box-shadow: 0 0 15px cyan; background: #003333; }
        .select-card img { border-radius: 5px; display: block; margin-bottom: 5px; width: 100%; height: auto; }
        .char-img { width: 100px; height: 100px; object-fit: cover; }
        .stage-img { width: 200px; height: 100px; object-fit: cover; }
        .section-title { color: cyan; margin: 15px 0 5px 0; text-transform: uppercase; font-size: 18px; font-weight: bold; }

        /* OVERLAYS */
        #quiz-overlay { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(10, 10, 30, 0.85); border: 4px solid cyan; padding: 40px; display: none; flex-direction: column; align-items: center; width: 70%; max-width: 800px; text-align: center; border-radius: 20px; z-index: 100; backdrop-filter: blur(5px); }
        .options-container { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; width: 100%; margin-top: 30px; }
        .opt-btn { background: #1a1a4a; border: 2px solid cyan; color: white; padding: 20px; cursor: pointer; border-radius: 10px; font-size: 18px; }
        
        #message-box { position: absolute; bottom: 120px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.9); color: #00ffff; padding: 15px 30px; border: 2px solid #00ffff; border-radius: 10px; display: none; z-index: 150; text-align: center; font-size: 20px; font-weight: bold; box-shadow: 0 0 20px rgba(0, 255, 255, 0.4); animation: popIn 0.3s ease-out; }
        @keyframes popIn { 0% { transform: translate(-50%, 20px) scale(0.8); opacity: 0; } 100% { transform: translate(-50%, 0) scale(1); opacity: 1; } }
        
        #victory-ui { position: absolute; bottom: 50px; left: 50%; transform: translateX(-50%); display: none; z-index: 200; flex-direction: column; align-items: center; gap: 20px; }
        #victory-text { font-size: 40px; color: yellow; text-shadow: 0 0 10px red; font-weight: bold; text-transform: uppercase; margin-bottom: 20px; }
        #tutor-explanation { margin-top: 20px; padding: 15px; background: rgba(0, 255, 255, 0.1); border-left: 4px solid cyan; text-align: left; font-size: 16px; display: none; }
        
        /* CONTROLES MÓVEIS */
        #mobile-controls { 
            position: absolute; bottom: 20px; width: 100%; height: 180px; 
            display: none; pointer-events: none; z-index: 50; 
            justify-content: space-between; padding: 0 30px; box-sizing: border-box; 
            opacity: 0; transition: opacity 1s; 
        }

        /* ✨ REGRA CORRIGIDA: Só mostra se for dispositivo de toque */
        @media (pointer: coarse) { 
            #mobile-controls.visible { display: flex; opacity: 1; } 
        }
        
        /* JOYSTICK ESQUERDO */
        .joystick-area {
            width: 150px; height: 150px; position: relative; pointer-events: auto;
        }
        .joystick-base {
            width: 120px; height: 120px; 
            background: rgba(255, 255, 255, 0.1); 
            border: 2px solid rgba(255, 255, 255, 0.3); 
            border-radius: 50%; 
            position: absolute; bottom: 10px; left: 10px;
            display: flex; justify-content: center; align-items: center;
        }
        .joystick-stick {
            width: 50px; height: 50px; 
            background: rgba(0, 255, 255, 0.5); 
            border-radius: 50%; 
            box-shadow: 0 0 10px cyan;
            position: absolute;
            transform: translate(0, 0); /* Controlado via JS */
        }

        /* BOTÕES DE AÇÃO (DIREITA) */
        .actions-area {
            width: 180px; height: 180px; position: relative; pointer-events: auto;
        }
        .touch-btn {
            width: 60px; height: 60px; 
            background: rgba(255, 255, 255, 0.15); 
            border: 2px solid rgba(255, 255, 255, 0.3); 
            border-radius: 50%; 
            color: white; font-size: 14px; font-weight: bold; 
            display: flex; justify-content: center; align-items: center; 
            user-select: none; touch-action: manipulation; backdrop-filter: blur(4px); cursor: pointer;
            position: absolute;
        }
        .touch-btn:active, .touch-btn.active { background: rgba(0, 255, 255, 0.4); border-color: cyan; transform: scale(0.95); }
        
        /* Layout Diamante */
        .btn-jump { top: 0; left: 60px; background: rgba(0, 255, 0, 0.2); } /* W - Topo */
        .btn-down { bottom: 0; left: 60px; background: rgba(255, 255, 255, 0.2); } /* S - Baixo */
        .btn-atk { top: 60px; left: 0; background: rgba(255, 0, 0, 0.2); width: 65px; height: 65px; } /* F - Esquerda */
        .btn-shoot { top: 60px; right: 0; background: rgba(255, 255, 0, 0.2); width: 65px; height: 65px;} /* G - Direita */

        #debug-toggle { position: absolute; bottom: 20px; left: 20px; font-size: 14px; color: #888; pointer-events: auto; z-index: 60; display: flex; align-items: center; gap: 5px; cursor: pointer; }
        
        /* BOTÃO FULLSCREEN MOBILE */
        #fullscreen-btn {
            position: absolute; top: 10px; right: 10px; z-index: 200;
            background: rgba(0,0,0,0.5); border: 1px solid #555;
            color: white; padding: 5px 10px; border-radius: 5px;
            font-size: 12px; pointer-events: auto;
            display: none; /* Só aparece em mobile via CSS */
        }
        @media (pointer: coarse) { #fullscreen-btn { display: block; } }
    </style>
</head>
<body>

    <div id="loading-screen" style="display: none;">
        <div class="spinner"></div>
        <p id="loading-text" style="margin-top: 20px; color: cyan;">A conectar ao GitHub...</p>
        <button id="start-btn" style="display:none; padding: 10px 30px; border-radius: 20px; border: none; background: cyan; cursor: pointer; font-weight: bold;">ENTRAR NO JOGO</button>
    </div>

    <!-- TELA DE SELEÇÃO -->
    <div id="selection-screen">
        <h1 style="color:white; margin-bottom: 20px; text-shadow: 0 0 10px cyan;">SELEÇÃO DE BATALHA</h1>
        <div class="section-title">Jogador 1</div>
        <div class="selection-grid" id="p1-select-container"></div>
        <div class="section-title">Jogador 2</div>
        <div class="selection-grid" id="p2-select-container"></div>
        <div class="section-title">Cenário</div>
        <div class="selection-grid" id="stage-select-container"></div>
        <button class="gemini-btn" id="confirm-selection-btn" style="font-size: 20px; padding: 15px 40px; margin-top: 30px; margin-bottom: 50px;">INICIAR COMBATE</button>
    </div>

    <div id="game-container">
        <button id="fullscreen-btn">Tela Cheia</button>
        <!-- VÍDEO DE INTRODUÇÃO -->
        <video id="intro-video-element" playsinline crossOrigin="anonymous"></video>
        <!-- VÍDEO DE BACKGROUND -->
        <video id="bg-video-element" loop muted autoplay playsinline crossOrigin="anonymous"></video>

        <div class="hud" id="hud-layer">
            <div>
                <div class="health-bar-container"><div id="p1-health-fill" class="health-fill"></div></div>
                <div id="p1-charge" class="charge-bar"></div>
            </div>
            <div id="ai-menu">
                <input type="text" id="theme-input" value="Matemática Básica do Ensino Fundamental" placeholder="Tema do Quiz">
                <button class="gemini-btn" onclick="generateQuestions()">Gerar Desafios ✨</button>
                <div id="loader" style="display:none; color: cyan;">IA a processar...</div>
            </div>
            <div>
                <div class="health-bar-container"><div id="p2-health-fill" class="health-fill"></div></div>
                <div id="p2-charge" class="charge-bar"></div>
            </div>
        </div>

        <canvas id="gameCanvas"></canvas>
        <div id="message-box"></div>

        <div id="victory-ui">
            <div id="victory-text">VITÓRIA!</div>
            <button class="gemini-btn" onclick="location.reload()">VOLTAR À SELEÇÃO</button>
        </div>

        <!-- CONTROLES MÓVEIS REESTRUTURADOS -->
        <div id="mobile-controls">
            <!-- Joystick Esquerdo -->
            <div class="joystick-area" id="joystick-zone">
                <div class="joystick-base">
                    <div class="joystick-stick" id="joystick-stick"></div>
                </div>
            </div>

            <!-- Botões de Ação Direito -->
            <div class="actions-area">
                <div class="touch-btn btn-jump" data-key="w">PULAR</div>
                <div class="touch-btn btn-down" data-key="s">DESCER</div>
                <div class="touch-btn btn-atk" data-key="f">SOCO</div>
                <div class="touch-btn btn-shoot" data-key="g">TIRO</div>
            </div>
        </div>

        <div id="quiz-overlay">
            <h2 id="quiz-question" style="font-size: 28px; color: cyan;">Pergunta?</h2>
            <div class="options-container" id="quiz-options"></div>
            <div id="tutor-explanation"></div>
            <button id="quiz-continue-btn" class="opt-btn" style="display:none; margin-top:20px; width:100%;">Continuar</button>
        </div>
        
        <div id="debug-toggle"><input type="checkbox" id="debug-check"> <span style="color:white; background:rgba(0,0,0,0.5); padding:2px;">Debug</span></div>
    </div>

    <script>
        const apiKey = ""; 

        // 1. CONFIGURAÇÃO GERAL
        const REPO_ROOT = "https://raw.githubusercontent.com/gr4ndi09-cell/game_assets/main/assets";
        const WORLD_WIDTH = 2752, WORLD_HEIGHT = 1536;
        const CANVAS_WIDTH = 1280, CANVAS_HEIGHT = 720;
        const ASPECT_RATIO = CANVAS_HEIGHT / CANVAS_WIDTH;
        const MIN_VIEW_WIDTH = 1000, MAX_VIEW_WIDTH = 2752;
        const MAX_VIEW_HEIGHT = MAX_VIEW_WIDTH * ASPECT_RATIO;
        const MIN_VIEW_HEIGHT = MIN_VIEW_WIDTH * ASPECT_RATIO;
        const GRAVITY = 2500, JUMP_FORCE = 1600, MOVE_SPEED = 600, GROUND_Y = 1530; 
        const FRAME_WIDTH = 240, FRAME_HEIGHT = 237;

        const LOGICAL_STATE = { RUN: 'RUN', IDLE: 'IDLE', MELEE: 'MELEE', JUMP: 'JUMP', SHOOT: 'SHOOT' };
        const TIGER_MAP = { [LOGICAL_STATE.RUN]: 0, [LOGICAL_STATE.IDLE]: 1, [LOGICAL_STATE.MELEE]: 2, [LOGICAL_STATE.JUMP]: 3, [LOGICAL_STATE.SHOOT]: 4 };
        const CRUZADO_MAP = { [LOGICAL_STATE.MELEE]: 0, [LOGICAL_STATE.IDLE]: 1, [LOGICAL_STATE.JUMP]: 2, [LOGICAL_STATE.RUN]: 3, [LOGICAL_STATE.SHOOT]: 4 };

        const CHARACTERS_DB = [
            { id: 'tiger', name: 'Tiger', portrait: `${REPO_ROOT}/chars/tiger/portrait.png`, folder: `${REPO_ROOT}/chars/tiger`, map: TIGER_MAP, audio: { jump: `${REPO_ROOT}/chars/tiger/audio/jump.mp3`, charge_shot: `${REPO_ROOT}/chars/tiger/audio/charge_shot.mp3` } },
            { id: 'cruzado', name: 'Cruzado', portrait: `${REPO_ROOT}/chars/cruzado/portrait.png`, folder: `${REPO_ROOT}/chars/cruzado`, map: CRUZADO_MAP, audio: { jump: `${REPO_ROOT}/chars/cruzado/audio/jump.mp3`, charge_shot: `${REPO_ROOT}/chars/cruzado/audio/charge_shot.mp3` } }
        ];

        const STAGES_DB = [
            { id: 'floresta', name: 'Floresta Sombria', portrait: `${REPO_ROOT}/cenarios/floresta/portrait.png`, folder: `${REPO_ROOT}/cenarios/floresta`, audio: { intro: `${REPO_ROOT}/cenarios/floresta/audio/intro.mp3`, ambience: `${REPO_ROOT}/cenarios/floresta/audio/ambience.mp3` } },
            { id: 'cristalcave', name: 'Caverna de Cristal', portrait: `${REPO_ROOT}/cenarios/cristalcave/portrait.png`, folder: `${REPO_ROOT}/cenarios/cristalcave`, audio: { intro: `${REPO_ROOT}/cenarios/cristalcave/audio/intro.mp3`, ambience: `${REPO_ROOT}/cenarios/cristalcave/audio/ambience.mp3` } }
        ];

        const ANIM_CONFIG = {
            [LOGICAL_STATE.RUN]:   { frames: 10, duration: 0.08 },
            [LOGICAL_STATE.IDLE]:  { frames: 10, duration: 0.1 },
            [LOGICAL_STATE.MELEE]: { frames: 10, duration: 0.05, damageStartFrame: 5 }, 
            [LOGICAL_STATE.JUMP]:  { frames: 10, duration: 0.1 },
            [LOGICAL_STATE.SHOOT]: { frames: 10, duration: 0.08 }
        };

        const COMMON_SOUNDS = { shot: `${REPO_ROOT}/sounds/common/shot.mp3`, hit: `${REPO_ROOT}/sounds/common/hit.mp3` };

        // 2. ESTADO GLOBAL
        let assets = { loaded: false };
        let colliders = []; 
        let keys = {};
        let camera = { x: 0, y: 0, viewWidth: MAX_VIEW_WIDTH, viewHeight: MAX_VIEW_HEIGHT, targetViewWidth: MAX_VIEW_WIDTH };
        let gameState = 'SELECTION'; 
        let questions = [{ q: "Pronto?", options: ["Sim"], correct: 0 }];
        let bullets = [], explosions = [];
        let p1 = null, p2 = null, bossEntity = null; 
        let currentWinner = null, currentLoser = null;
        let lastTime = 0, cinematicTimer = 0;
        let globalParticles = [], zoneParticles = [];
        let stageFX = null;
        let introFinished = false; 
        let gameLoopRunning = false;
        let mysticFruit={active:false,x:0,y:0,radius:25,lastSpawnTime:0,pulse:0,healAmount:40,glints:[],smoke:[]};
        
        // ✨ ARRAY DINÂMICA DE SPAWN
        let fruitSpawnPoints = []; 
        
        let selectedP1 = CHARACTERS_DB[0];
        let selectedP2 = CHARACTERS_DB[1];
        let selectedStage = STAGES_DB[0];

        // 3. REFERÊNCIAS DOM
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const videoBg = document.getElementById('bg-video-element');
        const videoIntro = document.getElementById('intro-video-element');
        const startBtn = document.getElementById('start-btn');
        const selectionScreen = document.getElementById('selection-screen');
        const loadingScreen = document.getElementById('loading-screen');
        const msgBox = document.getElementById('message-box');
        const hudLayer = document.getElementById('hud-layer');
        const mobileControls = document.getElementById('mobile-controls');
        const victoryUI = document.getElementById('victory-ui');
        const victoryText = document.getElementById('victory-text');
        const debugCheck = document.getElementById('debug-check');
        const fullscreenBtn = document.getElementById('fullscreen-btn');

        // 4. FUNÇÕES UTILITÁRIAS
        function isImageOk(img) { return img && img.complete && img.naturalWidth !== 0; }
        
        function showMessage(text, duration = 3000) { 
            msgBox.innerText = text; msgBox.style.display = 'block'; 
            msgBox.style.animation = 'none'; msgBox.offsetHeight; msgBox.style.animation = 'popIn 0.3s ease-out';
            setTimeout(() => { msgBox.style.display = 'none'; }, duration); 
        }

        // ✨ HELPER PARA FULLSCREEN
        function goFullScreen() {
            const doc = window.document;
            const docEl = doc.documentElement;
            const requestFullScreen = docEl.requestFullscreen || docEl.mozRequestFullScreen || docEl.webkitRequestFullScreen || docEl.msRequestFullscreen;
            if (requestFullScreen) {
                requestFullScreen.call(docEl).catch(err => console.log("Fullscreen negado (necessita interação)."));
            }
        }
        
        fullscreenBtn.onclick = goFullScreen;

        function drawSupernova(ctx, x, y) {
            ctx.save(); ctx.translate(x, y); const time = Date.now() / 1000;
            const grd = ctx.createRadialGradient(0, 0, 10, 0, 0, 800);
            grd.addColorStop(0, "white"); grd.addColorStop(0.1, "cyan"); grd.addColorStop(1, "transparent");
            ctx.fillStyle = grd; ctx.globalCompositeOperation = 'screen';
            ctx.fillRect(-800, -800, 1600, 1600);
            ctx.rotate(time * 0.2); ctx.fillStyle = "rgba(255, 255, 255, 0.1)";
            for (let i = 0; i < 20; i++) { ctx.rotate((Math.PI * 2) / 20); ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(50, 1000); ctx.lineTo(-50, 1000); ctx.fill(); }
            ctx.restore();
        }

        // 5. GESTOR DE ÁUDIO
        const audioManager = {
            sounds: {}, bgm: null,
            load(key, url) { if(!url) return; const a = new Audio(); a.src = url; a.crossOrigin = "anonymous"; this.sounds[key] = a; },
            play(key, loop = false, volume = 1.0) {
                const snd = this.sounds[key]; if (snd) {
                    if (!loop) { const c = snd.cloneNode(); c.volume = volume; c.play().catch(()=>{}); }
                    else { snd.loop = true; snd.volume = volume; snd.play().catch(()=>{}); this.bgm = snd; }
                }
            },
            stopBGM() { if (this.bgm) { this.bgm.pause(); this.bgm.currentTime = 0; } }
        };

        // --- 8. IA (GEMINI) - Definidas globalmente ---
        async function geminiFetch(prompt, system) {
            let delay = 1000;
            for (let i = 0; i < 5; i++) {
                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }], systemInstruction: { parts: [{ text: system }] }, generationConfig: { responseMimeType: "application/json" } })
                    });
                    if (!response.ok) throw new Error();
                    const data = await response.json(); return JSON.parse(data.candidates[0].content.parts[0].text);
                } catch (e) { await new Promise(r => setTimeout(r, delay)); delay *= 2; }
            }
        }
        async function generateQuestions() {
            const theme = document.getElementById('theme-input').value || 'História'; document.getElementById('loader').style.display = 'block';
            try { const result = await geminiFetch(`Gere 5 perguntas sobre "${theme}". Formato: { "questions": [{ "q": "p", "options": ["o1","o2","o3","o4"], "correct": 0 }] }`, "És um professor sábio."); if (result.questions) { questions = result.questions; showMessage("✨ Desafios carregados!"); } } catch (e) { showMessage("Erro na IA."); } finally { document.getElementById('loader').style.display = 'none'; }
        }
        async function explainTopic(question, answer) {
            const tutorEl = document.getElementById('tutor-explanation'); tutorEl.style.display = 'block'; tutorEl.innerText = "A pensar...";
            try { const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ contents: [{ parts: [{ text: `Pergunta: ${question}. Resposta: ${answer}. Explica em 2 frases.` }] }], systemInstruction: { parts: [{ text: "És um tutor amigável." }] } }) }); const data = await r.json(); tutorEl.innerText = data.candidates[0].content.parts[0].text; } catch (e) { tutorEl.innerText = "Continua a lutar!"; }
        }

        // 6. CLASSES DO JOGO

        class AmbientParticle { 
            constructor(z=null){this.z=z;this.reset();} 
            reset(){
                if(this.z){
                    this.x=this.z.x+Math.random()*this.z.w; this.y=this.z.y+Math.random()*this.z.h;
                    this.vx=(Math.random()-.5)*50; this.vy=(Math.random()-.5)*50; this.sz=Math.random()*2+.5; this.c='#ffaa00';
                }else{
                    this.x=Math.random()*WORLD_WIDTH; this.y=Math.random()*WORLD_HEIGHT;
                    this.vx=(Math.random()-.5)*60; this.vy=(Math.random()-.5)*60; this.sz=Math.random()*3+1; this.c=Math.random()>.5?'#ffffaa':'#00ffff';
                }
                this.a=Math.random();
            } 
            update(dt){
                this.x+=this.vx*dt; this.y+=this.vy*dt; this.a+=0.5*dt;
                if(this.x<0)this.x=WORLD_WIDTH;
                if(this.x>WORLD_WIDTH)this.x=0;
                if(this.y<0)this.y=WORLD_HEIGHT;
                if(this.y>WORLD_HEIGHT)this.y=0;
            } 
            draw(c){
                c.save();
                c.globalAlpha=Math.abs(Math.sin(this.a));
                c.shadowBlur=10; c.shadowColor=this.c; c.fillStyle=this.c;
                c.beginPath(); c.arc(this.x,this.y,this.sz,0,Math.PI*2); c.fill();
                c.restore();
            } 
        }

        class Particle {
            constructor(config) {
                this.type = config.type;
                this.baseColor = config.color;
                this.zone = config.zone || null; 
                this.gravity = config.gravity || 0;
                this.bounce = config.bounce || 0;
                this.friction = 0.98; 
                this.spawnDelay = config.spawnRate ? Math.random() * 2 : 0;
                this.spawnRate = config.spawnRate || 0;
                this.fadeRate = config.fadeRate || 0; 
                this.baseSize = config.baseSize || 2.0; 
                this.shape = config.shape || "circle"; 
                this.alpha = 0;
                
                // Propriedades para insetos
                this.initialX = 0;
                this.initialY = 0;
                
                this.reset();
            }
            reset() {
                if (this.zone) {
                    this.x = this.zone.x + Math.random() * this.zone.w;
                    this.y = this.zone.y + Math.random() * this.zone.h;
                } else {
                    this.x = Math.random() * WORLD_WIDTH;
                    this.y = Math.random() * WORLD_HEIGHT;
                }

                this.size = (Math.random() * 2 + 1) * (this.baseSize / 2);
                this.speedX = (Math.random() - 0.5) * 40;
                this.speedY = (Math.random() - 0.5) * 40;
                
                this.alpha = (this.type === 'rain') ? 0.6 : (Math.random() * 0.5 + 0.5);
                if (this.fadeRate > 0) this.alpha = 1.0; 
                
                if (this.type === 'rain') {
                    this.y = -10;
                    this.speedY = 300 + Math.random() * 200;
                    this.speedX = 50;
                    this.size = Math.random() * 20 + 10;
                } else if (this.type === 'upward') {
                    if (!this.zone) this.y = WORLD_HEIGHT + 10;
                    this.speedY = -20 - Math.random() * 50;
                } else if (this.type === 'spark') {
                    this.speedX = (Math.random() - 0.5) * 300;
                    this.speedY = -(Math.random() * 200 + 100);
                    this.gravity = 800;
                    this.bounce = 0.6;
                    this.shape = "square"; 
                } else if (this.type === 'insect') {
                    if (this.zone) {
                        this.x = this.zone.x + Math.random() * this.zone.w;
                        this.y = this.zone.y + Math.random() * this.zone.h;
                    }
                    this.initialX = this.x;
                    this.initialY = this.y;
                    this.speedX = (Math.random() - 0.5) * 60;
                    this.speedY = (Math.random() - 0.5) * 60;
                }
            }
            update(dt) {
                if (this.spawnDelay > 0) {
                    this.spawnDelay -= dt;
                    return; 
                }

                if (this.fadeRate > 0) {
                    this.alpha -= this.fadeRate * dt;
                    if (this.alpha <= 0) {
                        this.reset();
                        if (this.spawnRate > 0) {
                            this.spawnDelay = Math.random() * (10 / this.spawnRate); 
                        }
                        return;
                    }
                } else if (this.type === 'ambient') {
                    this.alpha += (Math.random() - 0.5) * 2 * dt;
                    if (this.alpha < 0) this.alpha = 0; else if (this.alpha > 1) this.alpha = 1;
                }

                // Lógica de Enxame de Insetos
                if (this.type === 'insect') {
                    let flee = false;
                    [p1, p2].forEach(p => {
                        if (!p) return;
                        let dx = (p.x + p.w/2) - this.x;
                        let dy = (p.y + p.h/2) - this.y;
                        let dist = Math.sqrt(dx*dx + dy*dy);
                        if (dist < 150) { 
                            flee = true;
                            this.speedX -= (dx / dist) * 800 * dt; // Repulsão forte
                            this.speedY -= (dy / dist) * 800 * dt;
                        }
                    });

                    if (!flee && this.zone) {
                        let centerX = this.zone.x + this.zone.w/2;
                        let centerY = this.zone.y + this.zone.h/2;
                        this.speedX += (Math.random() - 0.5) * 300 * dt; 
                        this.speedY += (Math.random() - 0.5) * 300 * dt;

                        // Paredes de contenção elásticas
                        const returnForce = 1000 * dt;
                        if (this.x < this.zone.x) this.speedX += returnForce;
                        else if (this.x > this.zone.x + this.zone.w) this.speedX -= returnForce;
                        
                        if (this.y < this.zone.y) this.speedY += returnForce;
                        else if (this.y > this.zone.y + this.zone.h) this.speedY -= returnForce;

                        this.speedX *= 0.92;
                        this.speedY *= 0.92;
                    } else {
                        this.speedX *= 0.96;
                        this.speedY *= 0.96;
                    }

                    this.x += this.speedX * dt;
                    this.y += this.speedY * dt;
                    this.alpha = 0.3 + Math.random() * 0.7; // Piscar
                    return;
                }

                this.speedY += this.gravity * dt;
                this.x += this.speedX * dt;
                this.y += this.speedY * dt;
                
                if (this.y >= GROUND_Y && this.type === 'spark') {
                    this.speedX *= this.friction;
                }

                if (this.y >= GROUND_Y) {
                    if (this.bounce > 0) {
                        this.y = GROUND_Y;
                        this.speedY *= -this.bounce;
                        if (Math.abs(this.speedY) < 50) this.speedY = 0;
                    } else if (this.type !== 'spark') {
                        if (!this.zone && this.y > WORLD_HEIGHT + 50) this.reset();
                    }
                }

                if (this.type === 'spark') {
                    [p1, p2].forEach(p => {
                        if (this.x > p.x && this.x < p.x + p.w && this.y > p.y && this.y < p.y + p.h) {
                            this.speedX *= -0.8; 
                            this.speedY *= 0.8;
                        }
                    });
                }
                
                const isOutOfBounds = (this.x < -100 || this.x > WORLD_WIDTH + 100 || this.y < -100 || this.y > WORLD_HEIGHT + 100);
                const isStopped = (this.type === 'spark' && Math.abs(this.speedX) < 1 && Math.abs(this.speedY) < 1);
                
                if ((isOutOfBounds || isStopped) && this.fadeRate <= 0) {
                    this.reset();
                    if (this.spawnRate > 0) {
                        this.spawnDelay = Math.random() * (10 / this.spawnRate);
                    }
                }
            }
            draw(ctx) {
                if (this.spawnDelay > 0) return;

                ctx.save();
                ctx.globalAlpha = this.type === 'rain' ? 0.6 : Math.max(0, this.alpha);
                ctx.fillStyle = this.baseColor;
                
                if (this.type === 'rain') {
                    ctx.strokeStyle = this.baseColor; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(this.x, this.y); ctx.lineTo(this.x - 5, this.y + this.size); ctx.stroke();
                } else if (this.type === 'spark') {
                    ctx.globalCompositeOperation = 'screen';
                    ctx.shadowBlur = 10; ctx.shadowColor = this.baseColor;
                    ctx.fillRect(this.x, this.y, this.size, this.size);
                } else {
                    ctx.shadowBlur = 10; ctx.shadowColor = this.baseColor; 
                    ctx.beginPath();
                    
                    if (this.shape === "square") {
                        ctx.fillRect(this.x - this.size/2, this.y - this.size/2, this.size, this.size);
                    } else if (this.shape === "leaf") {
                        ctx.ellipse(this.x, this.y, this.size, this.size/2, this.alpha * 10, 0, 2 * Math.PI);
                    } else if (this.shape === "star") {
                         ctx.moveTo(this.x, this.y - this.size);
                         ctx.lineTo(this.x + this.size/2, this.y);
                         ctx.lineTo(this.x, this.y + this.size);
                         ctx.lineTo(this.x - this.size/2, this.y);
                    } else if (this.shape === "fish") {
                         ctx.ellipse(this.x, this.y, this.size, this.size/1.8, 0, 0, Math.PI*2);
                         ctx.moveTo(this.x - this.size, this.y);
                         ctx.lineTo(this.x - this.size * 1.6, this.y - this.size/2);
                         ctx.lineTo(this.x - this.size * 1.6, this.y + this.size/2);
                    } else {
                        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); 
                    }
                    ctx.fill();
                }
                ctx.restore();
            }
        }

        class StageFX {
            constructor() {
                this.particlesByLayer = { bg: [], scene: [], main: [], front: [] };
                this.lights = [];
                this.zones = [];
            }
            init(stageConfig) {
                this.particlesByLayer = { bg: [], scene: [], main: [], front: [] };
                this.lights = [];
                this.zones = [];

                if (!stageConfig) { this.addDefaultEmitters(); } 
                else {
                    const emitters = stageConfig.emitters || [];
                    this.lights = stageConfig.lights || [];
                    this.zones = stageConfig.zones || [];

                    emitters.forEach(emit => {
                        const layer = emit.layer || 'main';
                        if (!this.particlesByLayer[layer]) this.particlesByLayer[layer] = [];
                        for(let i=0; i<emit.count; i++) { this.particlesByLayer[layer].push(new Particle(emit)); }
                    });
                }
            }
            addDefaultEmitters() {
                const layer = 'main'; if (!this.particlesByLayer[layer]) this.particlesByLayer[layer] = [];
                for(let i=0; i<30; i++) { this.particlesByLayer[layer].push(new Particle({ type: 'ambient', color: '#ffaa00' })); }
                this.lights = [{ x: 1400, y: 800, radius: 200, color: 'rgba(255,255,255,0.1)' }];
            }
            update(dt) {
                for (const layer in this.particlesByLayer) {
                    this.particlesByLayer[layer].forEach(p => p.update(dt));
                }
            }
            draw(ctx, layerName) {
                if (this.particlesByLayer[layerName]) {
                    this.particlesByLayer[layerName].forEach(p => p.draw(ctx));
                }
                
                this.lights.forEach(l => {
                    const targetLayer = l.layer || 'main';
                    if (targetLayer === layerName) {
                        let f = 1;
                        const time = Date.now();
                        if (l.effect === 'pulse') f = Math.sin(time / 300) * 0.05 + 1; 
                        else if (l.effect === 'blink') f = Math.random() < 0.05 ? 0 : 1;
                        else if (l.effect === 'flicker') {
                            f = 1 + (Math.random() - 0.5) * 0.2; 
                            l.drawX = l.x + (Math.random() - 0.5) * 5;
                            l.drawY = l.y + (Math.random() - 0.5) * 5;
                        } else { l.drawX = l.x; l.drawY = l.y; }

                        const dx = l.drawX || l.x; const dy = l.drawY || l.y; const radius = Math.max(0, l.radius * f);
                        
                        // Background da Luz
                        if (l.background) {
                            ctx.save();
                            ctx.globalCompositeOperation = 'source-over';
                            const bgG = ctx.createRadialGradient(dx, dy, 0, dx, dy, radius);
                            bgG.addColorStop(0, l.background);
                            bgG.addColorStop(1, 'rgba(0,0,0,0)');
                            ctx.fillStyle = bgG;
                            ctx.beginPath(); ctx.arc(dx, dy, radius, 0, Math.PI * 2); ctx.fill();
                            ctx.restore();
                        }

                        const g = ctx.createRadialGradient(dx, dy, 0, dx, dy, radius);
                        g.addColorStop(0, l.color); g.addColorStop(1, 'rgba(0,0,0,0)');
                        ctx.fillStyle = g; ctx.globalCompositeOperation = 'screen';
                        ctx.beginPath(); ctx.arc(dx, dy, radius, 0, Math.PI * 2); ctx.fill();
                        ctx.globalCompositeOperation = 'source-over';
                    }
                });

                // ✨ DESENHA ZONAS DE EFEITO (Retangulares e Onduladas)
                const time = Date.now() / 1000;
                this.zones.forEach(z => {
                     const targetLayer = z.layer || 'front';
                     if (targetLayer !== layerName) return;

                     // Background da Zona
                     if (z.background) {
                         ctx.fillStyle = z.background;
                         ctx.fillRect(z.x, z.y, z.w, z.h);
                     }

                     if (z.style === 'radial') {
                         const g = ctx.createRadialGradient(z.x + z.w/2, z.y + z.h/2, 0, z.x + z.w/2, z.y + z.h/2, z.w/1.5);
                         g.addColorStop(0, `rgba(0,0,0,0)`);
                         g.addColorStop(1, z.color || `rgba(0,0,0,0.8)`);
                         ctx.fillStyle = g;
                         ctx.fillRect(z.x, z.y, z.w, z.h);
                     } else {
                         ctx.save();
                         ctx.beginPath();
                         ctx.rect(z.x, z.y, z.w, z.h); 
                         ctx.clip(); 

                         if (z.distortion) {
                             ctx.globalCompositeOperation = 'overlay'; 
                             ctx.globalAlpha = 0.3;
                             ctx.fillStyle = z.color || '#aaf';
                             
                             const amp = z.distortion.amplitude || 5;
                             const freq = z.distortion.frequency || 0.1;
                             const spd = z.distortion.speed || 5;
                             const waveHeight = 15;
                             const numWaves = Math.ceil(z.h / waveHeight) + 1;
                             
                             for(let i=0; i<numWaves; i++) {
                                 const yOffset = (time * spd * 10 + i * waveHeight) % (z.h + waveHeight);
                                 let actualY = z.y + z.h - yOffset;
                                 
                                 const xOffset = Math.sin(time * 3 + i * freq) * amp;
                                 try {
                                    ctx.drawImage(canvas, 
                                        z.x, actualY, z.w, waveHeight, // Source (simplificado)
                                        z.x + xOffset, actualY, z.w, waveHeight // Destino
                                    );
                                 } catch(e) {}
                                 
                                 ctx.fillRect(z.x + xOffset - 5, actualY, z.w + 10, waveHeight * 0.8);
                             }
                         } else {
                             ctx.fillStyle = z.color;
                             ctx.fillRect(z.x, z.y, z.w, z.h);
                         }
                         ctx.restore();
                     }
                });
            }
        }

        class BossParallax {
            constructor() { this.x = WORLD_WIDTH / 2; this.y = WORLD_HEIGHT / 2 - 200; this.layers = [ { key: 'boss1', speed: 0.02, offset: {x:0, y:0} }, { key: 'boss2', speed: 0.05, offset: {x:0, y:0} }, { key: 'boss3', speed: 0.09, offset: {x:0, y:0} }, { key: 'boss4', speed: 0.14, offset: {x:0, y:0} } ]; }
            update(dt) { 
                if (!p1 || !p2) return;
                const d1 = Math.hypot(p1.x-this.x, p1.y-this.y); const d2 = Math.hypot(p2.x-this.x, p2.y-this.y); const target = (d1 < d2) ? p1 : p2; const dx = target.x - this.x; const dy = target.y - this.y; 
                this.layers.forEach(l => { l.offset.x += (dx * l.speed - l.offset.x) * 2 * dt; l.offset.y += (dy * l.speed - l.offset.y) * 2 * dt; }); 
            }
            draw(ctx) { this.layers.forEach(l => { const img = assets[l.key]; if (isImageOk(img)) { const dx = this.x + l.offset.x - (img.naturalWidth/2); const dy = this.y + l.offset.y - (img.naturalHeight/2); ctx.drawImage(img, dx, dy); } }); }
        }

        class BulletParticle { constructor(x,y,c,s=1){this.x=x;this.y=y;this.vx=(Math.random()-.5)*400*s;this.vy=(Math.random()-.5)*400*s;this.l=1.0;this.d=1.5;this.sz=Math.random()*5+2;this.c=c;} update(dt){this.x+=this.vx*dt;this.y+=this.vy*dt;this.l-=this.d*dt;} draw(c){c.save();c.globalAlpha=Math.max(0,this.l);c.fillStyle=this.c;c.shadowBlur=10;c.shadowColor=this.c;c.beginPath();c.arc(this.x,this.y,Math.max(0,this.sz*this.l),0,Math.PI*2);c.fill();c.restore();} }
        
        class Explosion { constructor(x,y,c){this.x=x;this.y=y;this.c=c;this.r=0;this.mr=400;this.l=1.0;this.p=Array.from({length:60},()=>new BulletParticle(x,y,c,1.5));this.dd=false;} update(dt){this.r+=800*dt;this.l-=2*dt;this.p.forEach(p=>p.update(dt));this.p=this.p.filter(p=>p.l>0);if(!this.dd&&this.r>150){[p1,p2].forEach(p=>{let dx=(p.x+p.w/2)-this.x;let dy=(p.y+p.h/2)-this.y;if(Math.sqrt(dx*dx+dy*dy)<200)p.takeDamage(30);});this.dd=true;}} draw(c){c.save();const g=c.createRadialGradient(this.x,this.y,0,this.x,this.y,Math.max(0,this.r));g.addColorStop(0,"white");g.addColorStop(0.3,this.c);g.addColorStop(1,"transparent");c.fillStyle=g;c.globalAlpha=Math.max(0,this.l);c.globalCompositeOperation='screen';c.beginPath();c.arc(this.x,this.y,Math.max(0,this.r),0,Math.PI*2);c.fill();this.p.forEach(p=>p.draw(c));c.restore();} }
        
        class Projectile { 
            constructor(x,y,f,d,s,c,ic=false){
                this.x=x; this.y=y; this.vx=f; 
                this.damage=d; 
                this.size=s;   
                this.c=c; this.active=true; this.ic=ic; this.trail=[]; this.p=[]; this.sp=900+(ic?600:0);
                audioManager.play(ic?(c==='#ff3e3e'?'p1_charge':'p2_charge'):'shot_common',false,0.4);
            } 
            update(dt){
                if(Math.random()<0.5)this.p.push(new BulletParticle(this.x,this.y,this.c,this.ic?0.5:0.2));
                this.trail.unshift({x:this.x,y:this.y}); if(this.trail.length>10)this.trail.pop();
                this.p.forEach((p,i)=>{p.update(dt);if(p.l<=0)this.p.splice(i,1)});
                this.x+=this.vx*this.sp*dt; if(this.x<-300||this.x>WORLD_WIDTH+300)this.active=false;
            } 
            draw(c){
                c.save(); this.p.forEach(p=>p.draw(c));
                this.trail.forEach(p=>{c.globalAlpha=0.4;c.fillStyle=this.c;c.beginPath();c.arc(p.x,p.y,this.size,0,Math.PI*2);c.fill();});
                c.globalAlpha=1;c.fillStyle=this.ic?"white":this.c;c.shadowBlur=30;c.shadowColor=this.c;c.beginPath();c.arc(this.x,this.y,this.size,0,Math.PI*2);c.fill();c.restore();
            } 
        }

        class Player {
            constructor(x,y,c,ctrl,id,map){
                this.id=id;this.x=x;this.y=y;this.w=80;this.h=160;this.animMap=map;
                this.spriteOffsetX=(FRAME_WIDTH-this.w)/2;this.spriteOffsetY=(FRAME_HEIGHT-this.h);
                this.vx=0;this.vy=0;this.c=c;this.ctrl=ctrl;this.health=100;this.onGround=false;
                this.facing=(id==='p1')?1:-1;this.charge=0;this.isCharging=false;this.isAttacking=false;
                this.atkT=0;this.mHD=false;this.state=LOGICAL_STATE.IDLE;this.fX=0;this.aT=0;this.dF=0;
                this.onIce = false; // ✨ NOVA PROPRIEDADE: Gelo
            }
            setAnimation(n){
                if(this.state!==n){this.state=n;this.fX=0;this.aT=0;if(n===LOGICAL_STATE.MELEE)this.mHD=false;}
            }
            update(dt){
                if(gameState!=='PLAYING')return;
                let mov=false;
                // ✨ LÓGICA DE MOVIMENTO E ATRITO (Gelo vs Chão Normal)
                if(keys[this.ctrl.left]){
                    this.vx=-MOVE_SPEED;
                    this.facing=-1;
                    mov=true;
                }
                else if(keys[this.ctrl.right]){
                    this.vx=MOVE_SPEED;
                    this.facing=1;
                    mov=true;
                }
                else {
                    // Sem teclas pressionadas
                    if (this.onIce && this.onGround) {
                        this.vx *= 0.96; // ✨ Escorrega (baixa fricção)
                        if (Math.abs(this.vx) < 10) this.vx = 0; // Para eventualmente
                    } else {
                        this.vx = 0; // Para instantaneamente (chão normal)
                    }
                }
                
                if(keys[this.ctrl.up]&&this.onGround){this.vy=-JUMP_FORCE;this.onGround=false;audioManager.play(this.id==='p1'?'p1_jump':'p2_jump',false,0.5);}
                
                if(keys[this.ctrl.melee]&&!this.isAttacking){this.isAttacking=true;this.atkT=0.5;this.setAnimation(LOGICAL_STATE.MELEE);}
                
                if(keys[this.ctrl.shoot]){this.isCharging=true;this.charge=Math.min(100,this.charge+(100*dt));this.setAnimation(LOGICAL_STATE.SHOOT);}
                else if(this.isCharging){this.shoot();this.isCharging=false;this.charge=0;}
                
                if(!this.isAttacking&&!this.isCharging){
                    if(!this.onGround)this.setAnimation(LOGICAL_STATE.JUMP);
                    else if(Math.abs(this.vx)>0)this.setAnimation(LOGICAL_STATE.RUN);
                    else this.setAnimation(LOGICAL_STATE.IDLE);
                }
                
                if(this.atkT>0)this.atkT-=dt;else this.isAttacking=false;
                if(this.dF>0)this.dF-=dt;
                
                this.vy+=GRAVITY*dt*2;
                this.x+=this.vx*dt;
                this.y+=this.vy*dt;
                
                this.onGround=false;
                this.onIce = false; // Reset por frame
                
                if(this.x+this.w<0)this.x=WORLD_WIDTH;else if(this.x>WORLD_WIDTH)this.x=-this.w;
                if(this.y+this.h>GROUND_Y){this.y=GROUND_Y-this.h;this.vy=0;this.onGround=true;}
                
                const isDown=keys[this.ctrl.down];
                colliders.forEach(p=>{
                    if(!p.type||p.type==='rect'){
                        if(this.vy>=0&&this.y+this.h>p.y-10&&this.y+this.h<p.y+p.h+40&&this.x+this.w>p.x&&this.x<p.x+p.w){
                            if(p.isSpring){this.vy=-JUMP_FORCE*1.5;this.onGround=false;return;}
                            if(isDown&&p.id!==16)return;
                            this.y=p.y-this.h;
                            this.vy=0;
                            this.onGround=true;
                            // ✨ DETETA SE A PLATAFORMA É ESCORREGADIA
                            if (p.isSlippery) this.onIce = true;
                        }
                    }else if(p.type==='slope'){
                        if(this.x+this.w/2>p.x1&&this.x+this.w/2<p.x2){
                            let t=((this.x+this.w/2)-p.x1)/(p.x2-p.x1);
                            let ty=p.y1+t*(p.y2-p.y1);
                            if(this.vy>=0&&this.y+this.h>=ty-20&&this.y+this.h<=ty+30){
                                if(isDown)return;
                                this.y=ty-this.h;
                                this.vy=0;
                                this.onGround=true;
                                if (p.isSlippery) this.onIce = true;
                            }
                        }
                    }
                });
                
                this.aT+=dt;
                const c=ANIM_CONFIG[this.state];
                if(this.aT>=c.duration){
                    this.aT=0;
                    if(this.state===LOGICAL_STATE.SHOOT&&this.isCharging){this.fX++;if(this.fX>=c.frames)this.fX=7;}
                    else{this.fX=(this.fX+1)%c.frames;}
                    
                    if(this.state===LOGICAL_STATE.MELEE&&!this.mHD&&this.fX>=(c.damageStartFrame||0)){
                        this.checkMeleeHit();this.mHD=true;
                    }
                }
                
                document.getElementById(`${this.id}-health-fill`).style.width=this.health+'%';
                document.getElementById(`${this.id}-charge`).style.width=this.charge+'%';
            }
            checkMeleeHit(){let t=(this.id==='p1')?p2:p1;let r=95;let hX=this.facing===1?this.x+this.w:this.x-r;if(hX+r>t.x&&hX<t.x+t.w&&this.y+this.h>t.y&&this.y<t.y+t.h)t.takeDamage(15);}
            shoot(){const ic=this.charge>90;const sx=this.facing===1?this.x+this.w:this.x;const sy=this.y+(this.h*0.4);bullets.push(new Projectile(sx,sy,this.facing,ic?40:15,ic?35:12,this.c,ic));}

        function update(dt) {
            if (gameState === 'CINEMATIC') { cinematicTimer -= dt; if (cinematicTimer <= 0) showQuiz(); return; }
            if (gameState === 'PLAYING') {
                if (stageFX) stageFX.update(dt);
                // ✨ Partículas Globais (Sempre presentes)
                globalParticles.forEach(p => p.update(dt));
                
                if (bossEntity) bossEntity.update(dt);
                if (p1) p1.update(dt);
                if (p2) p2.update(dt);
                updateFruit(dt);
                
                for(let i=bullets.length-1;i>=0;i--){
                    for(let j=i-1;j>=0;j--){
                        const b1=bullets[i],b2=bullets[j];if(!b1||!b2)continue;
                        if(Math.hypot(b1.x-b2.x,b1.y-b2.y) < b1.size + b2.size){
                            if(b1.ic&&b2.ic){explosions.push(new Explosion((b1.x+b2.x)/2,(b1.y+b2.y)/2,"orange"));bullets.splice(i,1);bullets.splice(j,1);break;}
                            else if(b1.ic&&!b2.ic){bullets.splice(j,1);}else if(!b1.ic&&b2.ic){bullets.splice(i,1);break;}
                            else{bullets.splice(i,1);bullets.splice(j,1);break;}
                        }
                    }
                }
                bullets.forEach((b,i)=>{
                    b.update(dt);
                    let t=(b.c===p1.c)?p2:p1;
                    if(b.x>t.x&&b.x<t.x+t.w&&b.y>t.y&&b.y<t.y+t.h){
                        t.takeDamage(b.damage); 
                        b.active=false;
                    }
                    if(!b.active)bullets.splice(i,1);
                });
                explosions.forEach((e,i)=>{e.update(dt);if(e.life<=0)explosions.splice(i,1);});
            }
            updateCamera();
        }

            ctx.save(); 
            try {
                const scale = CANVAS_WIDTH / camera.viewWidth;

                if (isImageOk(assets.stage_bg)) ctx.drawImage(assets.stage_bg, camera.x * 0.5, camera.y * 0.5, WORLD_WIDTH, WORLD_WIDTH);

                const card = document.createElement('div'); card.className = 'select-card'; if (item === currentSelected) card.classList.add('selected');
                const img = document.createElement('img'); img.src = item.portrait; img.className = list === STAGES_DB ? 'stage-img' : 'char-img';
                img.onerror = () => { img.style.display = 'none'; card.innerText = item.name; };
                card.appendChild(img); card.onclick = () => { onSelect(item); Array.from(container.children).forEach(c => c.classList.remove('selected')); card.classList.add('selected'); };
                container.appendChild(card);
            });
        }

        // FUNÇÃO DE INICIALIZAÇÃO PRINCIPAL (HOISTED)
        function initSelectionScreen() {
            loadingScreen.style.display = 'none'; selectionScreen.style.display = 'flex';
            renderSelectionList(CHARACTERS_DB, 'p1-select-container', (char) => selectedP1 = char, selectedP1);
            renderSelectionList(CHARACTERS_DB, 'p2-select-container', (char) => selectedP2 = char, selectedP2);
            renderSelectionList(STAGES_DB, 'stage-select-container', (stage) => selectedStage = stage, selectedStage);
        }

        document.getElementById('confirm-selection-btn').onclick = () => {
            selectionScreen.style.display = 'none'; loadingScreen.style.display = 'flex'; document.getElementById('loading-text').innerText = "A carregar batalha..."; initGameWithSelection();
        };

        window.addEventListener('keydown', e => keys[e.key] = true);
        window.addEventListener('keyup', e => keys[e.key] = false);
        // ✨ LÓGICA DO JOYSTICK E BOTÕES MÓVEIS REFINADA
        document.querySelectorAll('.touch-btn').forEach(btn => { 
            const key = btn.getAttribute('data-key'); 
            const activate = (e) => { 
                if(e.cancelable) e.preventDefault(); 
                keys[key] = true; 
                btn.classList.add('active'); 
            }; 
            const deactivate = (e) => { 
                if(e.cancelable) e.preventDefault(); 
                keys[key] = false; 
                btn.classList.remove('active'); 
            }; 
            btn.addEventListener('mousedown', activate); 
            btn.addEventListener('mouseup', deactivate); 
            btn.addEventListener('mouseleave', deactivate); 
            btn.addEventListener('touchstart', activate, {passive: false}); 
            btn.addEventListener('touchend', deactivate, {passive: false}); 
            btn.addEventListener('touchcancel', deactivate, {passive: false}); 
        });

        // LÓGICA DO JOYSTICK (MANCHE)
        const joystickZone = document.getElementById('joystick-zone');
        const joystickStick = document.getElementById('joystick-stick');
        let joystickActive = false;
        let startX = 0;

        // Centraliza o stick inicialmente
        const resetJoystick = () => {
            joystickStick.style.transform = `translate(0px, 0px)`;
            keys['a'] = false; // Esquerda
            keys['d'] = false; // Direita
            joystickActive = false;
        };

        const handleJoystickMove = (e) => {
            if (!joystickActive) return;
            const touch = e.touches[0];
            const rect = joystickZone.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            
            // Calcula o deslocamento X relativo ao centro
            let deltaX = touch.clientX - centerX;
            
            // Limita o movimento visual do stick (raio de 35px)
            const maxDist = 35;
            if (deltaX > maxDist) deltaX = maxDist;
            if (deltaX < -maxDist) deltaX = -maxDist;
            
            joystickStick.style.transform = `translate(${deltaX}px, 0px)`;

            // Define as teclas virtuais
            if (deltaX < -10) {
                keys['a'] = true;
                keys['d'] = false;
            } else if (deltaX > 10) {
                keys['d'] = true;
                keys['a'] = false;
            } else {
                keys['a'] = false;
                keys['d'] = false;
            }
        };

        joystickZone.addEventListener('touchstart', (e) => {
            e.preventDefault();
            joystickActive = true;
            handleJoystickMove(e);
        }, {passive: false});

        joystickZone.addEventListener('touchmove', (e) => {
            e.preventDefault();
            handleJoystickMove(e);
        }, {passive: false});

        joystickZone.addEventListener('touchend', (e) => {
            e.preventDefault();
            resetJoystick();
        }, {passive: false});

        joystickZone.addEventListener('touchcancel', (e) => {
            e.preventDefault();
            resetJoystick();
        }, {passive: false});

        
        // --- 8. IA (GEMINI) - Definidas globalmente ---
        async function geminiFetch(prompt, system) {
            let delay = 1000;
            for (let i = 0; i < 5; i++) {
                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }], systemInstruction: { parts: [{ text: system }] }, generationConfig: { responseMimeType: "application/json" } })
                    });
                    if (!response.ok) throw new Error();
                    const data = await response.json(); return JSON.parse(data.candidates[0].content.parts[0].text);
                } catch (e) { await new Promise(r => setTimeout(r, delay)); delay *= 2; }
            }
        }
        async function generateQuestions() {
            const theme = document.getElementById('theme-input').value || 'História'; document.getElementById('loader').style.display = 'block';
            try { const result = await geminiFetch(`Gere 5 perguntas sobre "${theme}". Formato: { "questions": [{ "q": "p", "options": ["o1","o2","o3","o4"], "correct": 0 }] }`, "És um professor sábio."); if (result.questions) { questions = result.questions; showMessage("✨ Desafios carregados!"); } } catch (e) { showMessage("Erro na IA."); } finally { document.getElementById('loader').style.display = 'none'; }
        }
        async function explainTopic(question, answer) {
            const tutorEl = document.getElementById('tutor-explanation'); tutorEl.style.display = 'block'; tutorEl.innerText = "A pensar...";
            try { const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ contents: [{ parts: [{ text: `Pergunta: ${question}. Resposta: ${answer}. Explica em 2 frases.` }] }], systemInstruction: { parts: [{ text: "És um tutor amigável." }] } }) }); const data = await r.json(); tutorEl.innerText = data.candidates[0].content.parts[0].text; } catch (e) { tutorEl.innerText = "Continua a lutar!"; }
        }

        canvas.width = CANVAS_WIDTH; canvas.height = CANVAS_HEIGHT;
        
        // Chamada final segura
        initSelectionScreen();
    </script>
</body>
